<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 眼球成像模擬 - 視網膜透明度可調版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: '微軟正黑體', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI 介面樣式 */
        #ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            display: flex;
            flex-direction: row;
            gap: 25px;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 800px;
            z-index: 10;
        }

        /* 左上角資訊區 */
        #info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #eee;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 300px;
            z-index: 10;
        }

        #status-text { font-size: 24px; font-weight: bold; margin-top: 5px; display: block; }
        
        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            font-size: 13px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px;}

        /* 右上角放大鏡視窗 */
        #magnifier-container {
            position: absolute;
            top: 20px; 
            right: 20px;
            width: 240px; 
            height: 240px;
            background: transparent; /* 改為透明，避免遮擋 WebGL 背景 */
            border: 2px solid #4db8ff; 
            border-radius: 8px;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        
        .mag-header {
            padding: 8px;
            background: rgba(0,0,0,0.8);
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            text-align: center;
        }
        .mag-header h3 { margin: 0 0 5px 0; font-size: 14px; color: #4db8ff; }
        
        .zoom-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
            padding: 0 5px;
        }
        .zoom-control input { width: 60%; margin: 0; cursor: pointer; }

        /* 左側控制區 */
        .left-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            min-width: 200px;
            border-right: 1px solid #555;
            padding-right: 20px;
            position: relative;
            z-index: 1; 
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .btn-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        button {
            background: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid #555;
            flex: 1;
        }

        button:hover { background: #555; }
        
        button.active {
            background: #007bff;
            border-color: #0056b3;
            font-weight: bold;
        }

        /* 右側滑桿區 */
        .slider-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px; /* 稍微縮小間距以容納第三個滑桿 */
            width: 100%;
            position: relative; 
        }

        .slider-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.3s ease-in-out; 
            border-radius: 8px;
            position: relative; 
        }

        /* 遠視模式下的特殊樣式 */
        .slider-container.hyperopia-mode {
            width: 170%; 
            margin-left: -70%; 
            z-index: 20; 
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }
        
        .slider-container.hyperopia-mode::after {
            display: none;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #ccc;
        }
        
        .slider-marks {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: -3px;
        }

        .auto-focus-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #555;
            width: 100%;
            box-sizing: border-box;
            justify-content: center;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 18px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 20px;
        }
        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider-toggle { background-color: #007bff; }
        input:checked + .slider-toggle:before { transform: translateX(18px); }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            -webkit-appearance: none; 
            height: 6px;
            background: #444;
            border-radius: 3px;
            outline: none;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #007bff;
            margin-top: 0px; 
        }
        
        @media (max-width: 800px) {
            #ui-panel { width: 95%; gap: 15px; }
            #magnifier-container { width: 180px; height: 180px; }
        }
        @media (max-width: 600px) {
            #ui-panel { flex-direction: column; gap: 15px; bottom: 10px; }
            .left-controls { border-right: none; border-bottom: 1px solid #555; padding-bottom: 15px; padding-right: 0; width: 100%; }
            #magnifier-container { top: 10px; right: 10px; width: 160px; height: 160px; }
            .slider-container.hyperopia-mode { width: 100%; margin-left: 0; }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="info-overlay">
        <span id="status-text">正常聚焦(清晰)</span>
        <div style="margin-top: 15px; border-top: 1px solid #555; padding-top: 10px;">
            <div class="legend"><span class="dot" style="background:#ff3333"></span> 實體物件</div>
            <div class="legend"><span class="dot" style="background:#00ffff;"></span> 頂部光線 (青)</div>
            <div class="legend"><span class="dot" style="background:#ff8800;"></span> 底部光線 (橘)</div>
            <div class="legend"><span class="dot" style="background:#ffff00;"></span> 實像匯聚 (黃)</div>
        </div>
    </div>

    <!-- 右上角放大鏡視窗 -->
    <div id="magnifier-container">
        <div class="mag-header">
            <h3>🔍 視網膜 3D 特寫</h3>
            <div class="zoom-control">
                <span>1x</span>
                <input type="range" id="zoom-slider" min="1" max="50" step="0.1" value="4">
                <span>50x</span>
            </div>
        </div>
    </div>

    <div id="ui-panel">
        <div class="left-controls">
            <div class="btn-group">
                <div class="btn-row">
                    <button onclick="setMode('normal')" id="btn-normal" class="active">正常</button>
                    <button onclick="setMode('myopia')" id="btn-myopia">近視</button>
                    <button onclick="setMode('hyperopia')" id="btn-hyperopia">遠視</button>
                </div>
            </div>

            <div class="auto-focus-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="auto-focus" checked>
                    <span class="slider-toggle"></span>
                </label>
                <span style="font-size: 14px; color: #eee;">自動對焦</span>
            </div>
        </div>
        
        <div class="slider-group">
            <div class="slider-container" id="dist-slider-container">
                <div class="slider-label">
                    <span>物體距離</span>
                    <span id="dist-val">中</span>
                </div>
                <input type="range" id="obj-dist" min="4" max="16" step="0.1" value="10">
                <div class="slider-marks">
                    <span id="mark-far">← 遠 (16)</span>
                    <span id="mark-near">近 (4) →</span>
                </div>
            </div>

            <div class="slider-container">
                <div class="slider-label">
                    <span>水晶體調節</span>
                    <span id="lens-val">標準</span>
                </div>
                <input type="range" id="lens-control" min="0" max="100" step="1" value="50">
                <div class="slider-marks">
                    <span>← 變薄 (看遠)</span>
                    <span>變厚 (看近) →</span>
                </div>
            </div>

            <!-- 新增：視網膜透明度滑桿 -->
            <div class="slider-container">
                <div class="slider-label">
                    <span>視網膜顯示 (透明度)</span>
                    <span id="opacity-val">30%</span>
                </div>
                <input type="range" id="retina-opacity" min="0" max="100" step="1" value="30">
                <div class="slider-marks">
                    <span>← 透明 (觀察光路)</span>
                    <span>清晰不透明 →</span>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let camera2; 
    
    let eyeGroup, lens, retinaMesh, eyeSphere;
    let objectArrow; 
    let ghostArrows = []; 
    let traceLines = []; 
    let realImageArrow; 
    
    let magZoom = 4.0; 
    
    const LENS_X = 0; 
    const NORMAL_RETINA_X = 5; 
    const SHORT_RETINA_X = 4.2; 
    
    let currentRetinaX = NORMAL_RETINA_X;
    
    const COLOR_TOP = 0x00ffff; 
    const COLOR_BOT = 0xff8800; 

    const BASE_THICKNESS = 0.2; 
    const MAX_THICKNESS = 0.32; 
    const MIN_THICKNESS = 0.08;
    
    let currentMode = 'normal'; 
    let objectDistance = 10;
    let lensThickness = BASE_THICKNESS;
    let minSliderValue = 0; 

    const arrowShapePoints = [
        new THREE.Vector2(0, 1),   
        new THREE.Vector2(0.3, 0.4), 
        new THREE.Vector2(0.1, 0.4), 
        new THREE.Vector2(0.1, -1),  
        new THREE.Vector2(-0.1, -1), 
        new THREE.Vector2(-0.1, 0.4),
        new THREE.Vector2(-0.3, 0.4) 
    ];

    function init() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 20); 

        camera2 = new THREE.PerspectiveCamera(45, 1, 0.1, 1000); 

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setScissorTest(true); 
        container.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0); 
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(0, 10, 10);
        scene.add(dirLight);

        createEye();
        createObject();
        createGhostVisualization(); 
        
        window.addEventListener('resize', onWindowResize);
        
        const autoCheck = document.getElementById('auto-focus');
        autoCheck.addEventListener('change', () => {
            if(autoCheck.checked) {
                syncLensWithDistance();
            }
        });

        const zoomSlider = document.getElementById('zoom-slider');
        zoomSlider.addEventListener('input', (e) => {
            magZoom = parseFloat(e.target.value);
        });

        const distSlider = document.getElementById('obj-dist');
        distSlider.addEventListener('input', (e) => {
            const rawVal = parseFloat(e.target.value);
            objectDistance = 20 - rawVal;
            
            if (document.getElementById('auto-focus').checked) {
                syncLensWithDistance();
            }

            updateSimulation();
            let val = objectDistance;
            let text = "中";
            if(val < 6) text = "近";
            else if(val > 18) text = "極遠 (無限遠)";
            else if(val > 14) text = "遠";
            document.getElementById('dist-val').innerText = `${val.toFixed(1)} (${text})`;
        });

        const lensControl = document.getElementById('lens-control');
        lensControl.addEventListener('input', (e) => {
            if(e.isTrusted) { 
                 document.getElementById('auto-focus').checked = false;
            }

            let val = parseFloat(e.target.value);
            
            if (val < minSliderValue) {
                val = minSliderValue;
                e.target.value = minSliderValue; 
            }
            
            updateLensFromSlider(val);
            updateSimulation();
        });

        // 新增：視網膜透明度控制事件
        const opacityControl = document.getElementById('retina-opacity');
        opacityControl.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('opacity-val').innerText = `${val}%`;
            
            if(retinaMesh) {
                retinaMesh.material.opacity = val / 100;
                // 如果透明度為0，則關閉渲染以提升效能
                retinaMesh.visible = (val > 0);
            }
        });

        animate();
        updateSimulation();
    }

    function syncLensWithDistance() {
        const reqThickness = 0.7 + (10 - objectDistance) * 0.02 - currentRetinaX * 0.1;
        const range = MAX_THICKNESS - MIN_THICKNESS;
        let idealVal = (reqThickness - MIN_THICKNESS) / range * 100;
        
        idealVal = Math.max(0, Math.min(100, idealVal));
        
        let actualVal = idealVal;
        if (idealVal < minSliderValue) {
            actualVal = minSliderValue;
        }

        const lensControl = document.getElementById('lens-control');
        lensControl.value = actualVal;
        updateLensFromSlider(actualVal);
    }

    function updateLensFromSlider(val) {
        lensThickness = MIN_THICKNESS + (val / 100) * (MAX_THICKNESS - MIN_THICKNESS);

        let text = "標準";
        if(val > 80) text = "極厚 (看近)";
        else if(val > 55) text = "稍厚 (調節)";
        else if(val < 20) text = "極薄 (放鬆)";
        else if(val < 45) text = "稍薄";
        
        if (currentMode === 'myopia' && val <= minSliderValue && val > 1) {
             text += " <span style='color:#ff5555'>(調節極限)</span>";
        }
        if (currentMode === 'hyperopia' && val >= 99) {
             text += " <span style='color:#ff5555'>(已達調節極限)</span>";
        }
        document.getElementById('lens-val').innerHTML = text;
    }

    function createEye() {
        eyeGroup = new THREE.Group();
        scene.add(eyeGroup);

        const defaultRadius = (NORMAL_RETINA_X - LENS_X) / 2 + 0.5;
        const defaultCenter = (LENS_X + NORMAL_RETINA_X) / 2;

        const eyeGeo = new THREE.SphereGeometry(defaultRadius, 32, 24, 0, Math.PI * 2, 0, Math.PI);
        const eyeMat = new THREE.MeshBasicMaterial({ 
            color: 0x666666, 
            wireframe: true,
            transparent: true,
            opacity: 0.05 
        });
        eyeSphere = new THREE.Mesh(eyeGeo, eyeMat);
        eyeSphere.rotation.x = -Math.PI / 2;
        eyeSphere.position.set(defaultCenter, 0, 0);
        eyeGroup.add(eyeSphere);

        const lensGeo = new THREE.SphereGeometry(1.2, 32, 16);
        const lensMat = new THREE.MeshPhongMaterial({ 
            color: 0x88ccff, 
            transparent: true, 
            opacity: 0.5,
            shininess: 90
        });
        lens = new THREE.Mesh(lensGeo, lensMat);
        lens.scale.set(BASE_THICKNESS, 1, 1); 
        lens.position.set(LENS_X, 0, 0);
        eyeGroup.add(lens);

        const retinaGeo = new THREE.CircleGeometry(3.0, 32);
        const retinaMat = new THREE.MeshBasicMaterial({ 
            color: 0x111111, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3, // 預設透明度為 30%
            depthWrite: false 
        });
        retinaMesh = new THREE.Mesh(retinaGeo, retinaMat);
        retinaMesh.rotation.y = -Math.PI / 2;
        retinaMesh.position.set(NORMAL_RETINA_X, 0, 0);
        eyeGroup.add(retinaMesh);

        const shape = new THREE.Shape(arrowShapePoints);
        const geometry = new THREE.ShapeGeometry(shape);
        const realImageMat = new THREE.MeshBasicMaterial({ 
            color: 0xffff00, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8
        });
        realImageArrow = new THREE.Mesh(geometry, realImageMat);
        realImageArrow.position.set(0, 0, 0);
        realImageArrow.rotation.y = -Math.PI / 2; 
        eyeGroup.add(realImageArrow);
    }

    function createObject() {
        const shape = new THREE.Shape(arrowShapePoints);
        const extrudeSettings = { depth: 0.1, bevelEnabled: false };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        const material = new THREE.MeshPhongMaterial({ color: 0xff3333 });
        
        objectArrow = new THREE.Mesh(geometry, material);
        objectArrow.scale.set(0.5, 0.5, 0.5); 
        scene.add(objectArrow);
    }

    function createGhostVisualization() {
        const shape = new THREE.Shape(arrowShapePoints);
        const geometry = new THREE.ShapeGeometry(shape); 
        
        const ghostMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ff00, 
            transparent: true, 
            opacity: 0.25, 
            side: THREE.DoubleSide,
            depthWrite: false, 
            blending: THREE.AdditiveBlending 
        });

        const lineMatTop = new THREE.LineBasicMaterial({ color: COLOR_TOP, transparent: true, opacity: 0.4 });
        const lineMatBot = new THREE.LineBasicMaterial({ color: COLOR_BOT, transparent: true, opacity: 0.4 });

        for(let i=0; i<3; i++) {
            const ghost = new THREE.Mesh(geometry, ghostMat.clone());
            ghost.rotation.y = -Math.PI / 2; 
            ghost.position.set(currentRetinaX - 0.05, 0, 0);
            ghost.frustumCulled = false; 
            scene.add(ghost);
            ghostArrows.push(ghost);

            const geoTop = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()
            ]);
            const lineTop = new THREE.Line(geoTop, lineMatTop);
            lineTop.frustumCulled = false; 
            scene.add(lineTop);
            
            const geoBot = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()
            ]);
            const lineBot = new THREE.Line(geoBot, lineMatBot);
            lineBot.frustumCulled = false; 
            scene.add(lineBot);

            traceLines.push({ top: lineTop, bot: lineBot });
        }
    }

    function updateSimulation() {
        objectArrow.position.set(-objectDistance, 0, 0);
        if (lens) lens.scale.set(lensThickness, 1, 1);

        const arrowScale = 0.5;
        const arrowTopY = 1.0 * arrowScale;
        const arrowBotY = -1.0 * arrowScale;

        let convergenceX;
        const distDiff = 10 - objectDistance; 
        
        const distEffect = distDiff * 0.2;
        const thicknessDelta = lensThickness - BASE_THICKNESS;
        const refractionEffect = thicknessDelta * 10.0;
        
        let baseConvergence = NORMAL_RETINA_X;

        convergenceX = (baseConvergence + distEffect) - refractionEffect;
        convergenceX = Math.max(1.5, Math.min(12, convergenceX));

        const magnification = convergenceX / objectDistance;
        realImageArrow.position.set(convergenceX, 0, 0);
        
        const imageScale = arrowScale * magnification;
        realImageArrow.scale.set(imageScale, -imageScale, imageScale);

        const imageTipY = 1.0 * -imageScale;
        const imageBaseY = -1.0 * -imageScale;

        const lensPointsY = [1.0, 0, -1.0]; 

        for(let i=0; i<3; i++) {
            const lensY = lensPointsY[i];
            const ghost = ghostArrows[i];
            const lines = traceLines[i];

            ghost.position.x = currentRetinaX - 0.05;

            const retinaTipY = lensY + (currentRetinaX - 0) * (imageTipY - lensY) / (convergenceX - 0);
            const retinaBaseY = lensY + (currentRetinaX - 0) * (imageBaseY - lensY) / (convergenceX - 0);

            const projectedHeight = Math.abs(retinaTipY - retinaBaseY);
            const scaleY = projectedHeight / 2.0;
            const centerY = (retinaTipY + retinaBaseY) / 2.0;

            const isInverted = retinaTipY < retinaBaseY;
            ghost.scale.set(scaleY * 0.5, isInverted ? -scaleY : scaleY, 1); 
            ghost.position.y = centerY;

            const objTopPos = new THREE.Vector3(-objectDistance, arrowTopY, 0);
            const lensPos = new THREE.Vector3(0, lensY, 0);
            const imgTipPos = new THREE.Vector3(convergenceX, imageTipY, 0); 
            const retinaTopPos = new THREE.Vector3(currentRetinaX, retinaTipY, 0);
            
            lines.top.geometry.setFromPoints([objTopPos, lensPos, imgTipPos, retinaTopPos]);

            const objBotPos = new THREE.Vector3(-objectDistance, arrowBotY, 0);
            const imgBasePos = new THREE.Vector3(convergenceX, imageBaseY, 0); 
            const retinaBotPos = new THREE.Vector3(currentRetinaX, retinaBaseY, 0);
            
            lines.bot.geometry.setFromPoints([objBotPos, lensPos, imgBasePos, retinaBotPos]);
        }
        
        updateUIText(convergenceX - currentRetinaX);
    }

    function updateUIText(diff) {
        const title = document.getElementById('status-text');
        
        let statusHtml = "";
        const threshold = 0.25;

        if (Math.abs(diff) < threshold) {
            statusHtml = '<span style="color:#00ff00">⭕ 正常聚焦 (清晰)</span>';
        } else if (diff < -threshold) {
            statusHtml = '<span style="color:#ff3333">❌ 過早聚焦 (模糊)</span>';
        } else {
            statusHtml = '<span style="color:#ff3333">❌ 太晚聚焦 (模糊)</span>';
        }
        
        title.innerHTML = statusHtml;
    }

    function getCurrentModeName() {
        if(currentMode === 'normal') return "正常模式";
        if(currentMode === 'myopia') return "近視模式";
        if(currentMode === 'hyperopia') return "遠視模式";
    }

    window.setMode = function(mode) {
        currentMode = mode;
        const slider = document.getElementById('lens-control');
        const distSlider = document.getElementById('obj-dist');
        const distContainer = document.getElementById('dist-slider-container');
        const markFar = document.getElementById('mark-far');
        
        distContainer.classList.remove('hyperopia-mode');
        
        if (mode === 'hyperopia') {
            currentRetinaX = SHORT_RETINA_X; 
            const scaleX = SHORT_RETINA_X / NORMAL_RETINA_X;
            eyeSphere.scale.x = scaleX;
            eyeSphere.position.x = 2.1;
            retinaMesh.position.x = currentRetinaX;

            minSliderValue = 0;
            slider.style.background = '#444';
            
            distSlider.min = -8; 
            distSlider.max = 16;
            markFar.innerText = "← 極遠 (無限遠)";
            
            distContainer.classList.add('hyperopia-mode');

        } else if (mode === 'myopia') {
            currentRetinaX = NORMAL_RETINA_X;
            eyeSphere.scale.x = 1;
            eyeSphere.position.x = 2.5; 
            retinaMesh.position.x = currentRetinaX;

            minSliderValue = 75; 
            slider.style.background = 'linear-gradient(to right, #800 0%, #800 75%, #444 75%, #444 100%)';
            
            distSlider.min = 4;
            distSlider.max = 16;
            markFar.innerText = "← 遠 (16)";
        } else {
            currentRetinaX = NORMAL_RETINA_X;
            eyeSphere.scale.x = 1;
            eyeSphere.position.x = 2.5;
            retinaMesh.position.x = currentRetinaX;

            minSliderValue = 0;
            slider.style.background = '#444';
            
            distSlider.min = 4;
            distSlider.max = 16;
            markFar.innerText = "← 遠 (16)";
        }

        let targetDist = 10;
        if (mode === 'myopia') {
            targetDist = 5.0;
        }
        
        distSlider.value = 20 - targetDist;
        
        document.getElementById('auto-focus').checked = true; 
        distSlider.dispatchEvent(new Event('input'));

        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        
        updateSimulation(); 
    };

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // 1. 渲染主畫布
        renderer.setScissorTest(false);
        renderer.clear();
        renderer.setScissorTest(true);
        
        renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
        renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
        renderer.render(scene, camera);

        // 2. 渲染 3D 放大鏡
        const magDiv = document.getElementById('magnifier-container');
        const rect = magDiv.getBoundingClientRect();
        
        const pixelRatio = window.devicePixelRatio;
        const width = rect.width * pixelRatio;
        const height = (rect.height - 40) * pixelRatio; 
        const left = rect.left * pixelRatio;
        const bottom = (window.innerHeight - rect.bottom) * pixelRatio;

        camera2.quaternion.copy(camera.quaternion);
        camera2.position.copy(camera.position);
        camera2.zoom = magZoom;
        
        const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
        const retinaTarget = new THREE.Vector3(currentRetinaX, 0, 0); 
        camera2.position.copy(retinaTarget).add(offset);
        camera2.lookAt(retinaTarget);
        
        camera2.aspect = width / height;
        camera2.updateProjectionMatrix();

        renderer.setScissor(left, bottom, width, height);
        renderer.setViewport(left, bottom, width, height);
        
        // 關鍵修復：手動清除放大鏡區域的背景，並補上深灰色底色
        renderer.setClearColor(new THREE.Color(0x1a1a1a)); 
        renderer.clearColor();
        
        renderer.render(scene, camera2);
        
        // 恢復主畫面背景色設定
        renderer.setClearColor(scene.background); 
    }

    init();

</script>
</body>
</html>
