<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電流磁效應：直導線、環形線圈、螺線管 3D → 黑板畫法</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{--bg:#eef2f7;--panel:#ffffff;--ink:#1b2430;--muted:#5a6878;--line:#cfd8e3;--btn:#f3f6fa;--btnh:#e3ebf5;--cur:#e0561b;--fld:#2f7fe0;--arr:#0b1f66;--on:#1f6fd6;--cap:#fffbe8}
body.board{--bg:#20342b;--panel:#2b4a3b;--ink:#f4f1e6;--muted:#c9d6cc;--line:#47705a;--btn:#355946;--btnh:#416b55;--cur:#ffab7a;--fld:#9fd8ff;--arr:#ffffff;--on:#9fd8ff;--cap:#2f5241}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100vh}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#title{padding:6px 14px;font-size:22px;font-weight:800;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
#title small{font-size:15px;font-weight:500;color:var(--muted)}
#view{position:relative;flex:1;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{pointer-events:none}
#caption{padding:8px 14px;font-size:20px;line-height:1.4;background:var(--cap);min-height:64px;font-weight:600}
#caption .c{color:var(--cur)} #caption .f{color:var(--fld)} #caption .n{color:#d62828}
#side{overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 10px;font-size:15px}
.sec{margin-bottom:9px}
.sec h3{margin:3px 0 5px;font-size:15px;color:var(--muted);font-weight:700}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:7px;cursor:pointer;user-select:none;touch-action:manipulation}
button:hover{background:var(--btnh)}
button.on{background:var(--on);color:#fff;border-color:var(--on)}
body.board button.on{color:#16261e}
.preset{flex:1 1 46%;font-weight:700}
.mode{flex:1 1 30%;font-weight:700}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nav button{padding:5px 0}
input[type=range]{flex:1;min-width:80px}
label.sl{font-size:14px;color:var(--muted);min-width:96px}
#readout{font-size:17px;font-weight:700;line-height:1.5}
#bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
#bar div{height:100%;background:var(--fld);width:0}
.hint{font-size:13px;color:var(--muted);line-height:1.4;margin:4px 0}
@media (max-width:820px){
 #app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
 #main{height:78vh}
 #side{border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
 <div id="main">
  <div id="title"><span id="ttl">電流磁效應：長直載流導線</span><small>安培：電流大→磁場強，距離遠→磁場弱（B ∝ I / r）</small></div>
  <div id="view"><canvas id="c3"></canvas><canvas id="overlay"></canvas></div>
  <div id="caption"></div>
 </div>
 <div id="side">
  <div class="sec"><h3>磁場來源</h3>
   <div class="row"><button class="mode" data-m="straight">長直導線</button><button class="mode" data-m="loop">環形線圈</button><button class="mode" data-m="solenoid">螺線管</button></div>
   <div class="row" style="margin-top:5px"><button id="bendBtn">▶ 彎成線圈</button><button id="unbendBtn">◀ 拉回直線</button></div>
   <div class="row"><label class="sl">彎曲 <span id="bendVal">0</span>%</label><input type="range" id="bend" min="0" max="100" step="1" value="0"></div>
   <div class="row"><label class="sl">拉成螺線管 <span id="strVal">0</span>%</label><input type="range" id="stretch" min="0" max="100" step="1" value="0"></div>
   <div class="row"><label class="sl">匝數 N = <span id="Nval">8</span></label><button class="hold" id="Nminus">－</button><input type="range" id="turns" min="3" max="12" step="1" value="8"><button class="hold" id="Nplus">＋</button></div>
  </div>
  <div class="sec"><h3>視角（變成黑板畫法）</h3>
   <div class="row">
    <button class="preset" data-p="oblique">3D 斜視</button>
    <button class="preset" data-p="side">側視（紙面）</button>
    <button class="preset" data-p="top">俯視（從上往下）</button>
    <button class="preset" data-p="bottom">仰視（從下往上）</button>
   </div>
   <div class="row" style="margin-top:4px"><label class="sl" style="min-width:150px">切換畫法時 3D 保留 <span id="keepVal">30</span>%</label><input type="range" id="keep" min="0" max="100" step="5" value="30"></div></div>
  <div class="sec"><h3>電流</h3>
   <div class="row"><button id="dirUp" class="on">↑ 向上</button><button id="dirDown">↓ 向下</button><button id="dirFlip">⇅ 反轉</button></div>
   <div class="row" style="margin-top:4px"><label class="sl">I = <span id="Ival">5</span> A</label><button class="hold" id="Iminus">－</button><input type="range" id="Islider" min="1" max="10" step="0.5" value="5"><button class="hold" id="Iplus">＋</button></div></div>
  <div class="sec"><h3>探針（拖曳紫色球）</h3>
   <div id="readout"></div><div id="bar"><div></div></div>
   <div class="row" style="margin-top:5px"><button class="hold" id="rminus">遠離 －</button><button class="hold" id="rplus">＋ 遠離</button></div></div>
  <div class="sec"><h3>顯示</h3>
   <div class="row">
    <button id="tSingle" class="on">只顯示中間層</button>
    <button id="tHand" class="on">右手定則</button>
    <button id="tCharge" class="on">移動電荷</button>
    <button id="tCompass" class="on">小磁針</button>
    <button id="tBoard">黑板模式</button>
    <button id="tBar">棒狀磁鐵對照</button>
    <button id="tReal" title="預設以 N 個同軸圓線圈（理想螺線管）計算；開啟則用真實螺旋線計算，會有淨軸向電流造成的扭曲">真實螺旋磁場</button>
   </div></div>
  <div class="sec"><h3>鏡頭（可按住連續）</h3>
   <div class="nav">
    <button class="hold" data-a="rotL">⟲ 左轉</button><button class="hold" data-a="rotU">⤒ 上轉</button><button class="hold" data-a="rotR">⟳ 右轉</button>
    <button class="hold" data-a="panL">← 平移</button><button class="hold" data-a="rotD">⤓ 下轉</button><button class="hold" data-a="panR">平移 →</button>
    <button class="hold" data-a="panU">↑ 平移</button><button class="hold" data-a="panD">↓ 平移</button><button id="reset">重置</button>
    <button class="hold" data-a="zoomIn">＋ 放大</button><span></span><button class="hold" data-a="zoomOut">－ 縮小</button>
   </div>
   <p class="hint">左鍵拖曳：旋轉　右鍵或 Shift+拖曳：平移　滾輪：縮放</p></div>
 </div>
</div>
<script type="module">
import * as THREE from 'three';
import {LineSegments2} from 'three/addons/lines/LineSegments2.js';
import {LineSegmentsGeometry} from 'three/addons/lines/LineSegmentsGeometry.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
const $=id=>document.getElementById(id);
const view=$('view'), c3=$('c3'), ov=$('overlay'), ctx=ov.getContext('2d');
// ---------- state ----------
const R0=2, LW=2*Math.PI*R0, PITCH=0.62;
const S={keep:0.3,bar:false,realHelix:false,s:1,I:5,b:0,t:0,N:8,single:true,probeH:new THREE.Vector3(2.5,0,0),probeV:new THREE.Vector3(2.6,3.4,0),board:false,hand:true,charge:true,compass:true,preset:'oblique'};
const RADII=[0.8,1.4,2.1,3.0,4.1,5.4];
const LAYERS=[-2.6,0,2.6];
const SIDE_LAYERS=[-3.6,-2.7,-1.8,-0.9,0,0.9,1.8,2.7,3.6];
const COL={light:{cur:0xe0561b,fld:0x4f95ea,arr:0x0b1f66,out:0xffffff,bg:0xf6f8fb,plane:0x8aa0b8,probe:0x7a2fc0,hand:0xf2c29b,sN:0x9aa4ae,curS:'#e0561b',fldS:'#2f7fe0',arrS:'#0b1f66',ink:'#1b2430'},
           board:{cur:0xffab7a,fld:0x9fd8ff,arr:0xffffff,out:0x0d2a1e,bg:0x274536,plane:0xe8f0e0,probe:0xe7c6ff,hand:0xf6e7cf,sN:0xf2f2f2,curS:'#ffab7a',fldS:'#9fd8ff',arrS:'#ffffff',ink:'#f4f1e6'}};
const NRED=0xd62828;
const pal=()=>S.board?COL.board:COL.light;
const isStraight=()=>S.b<0.005&&S.t<0.005;
function modeName(){if(isStraight())return 'straight';if(S.t>0.995)return 'solenoid';if(S.t>0.005)return 'stretch';if(S.b>0.995)return 'loop';return 'bend';}
// analytic infinite straight wire (relative units, B = I/r)
function Bstraight(p){const r=Math.hypot(p.x,p.z);return new THREE.Vector3(S.s*p.z,0,-S.s*p.x).divideScalar(r).multiplyScalar(S.I/r);}
// ---------- wire geometry (current flows along increasing index when s=+1) ----------
const q2=v=>Math.round(v*100)/100;
function wirePts(b,t,N){const P=[];
  if(t>0.004){const turns=1+(N-1)*t,n=Math.ceil(turns*28),pe=PITCH*t;
    for(let i=0;i<=n;i++){const f=-Math.PI*turns+2*Math.PI*turns*i/n;P.push(new THREE.Vector3(pe*f/(2*Math.PI),R0*Math.sin(f),R0*Math.cos(f)));}return P;}
  const n=96;for(let i=0;i<=n;i++){const sp=-LW/2+LW*i/n;
    if(b<0.004)P.push(new THREE.Vector3(0,sp,0));
    else{const Rk=LW/(2*Math.PI*b),f=sp/Rk;P.push(new THREE.Vector3(0,Rk*Math.sin(f),R0-Rk*(1-Math.cos(f))-R0*(1-b)));}}
  return P;}
function segsOf(P,w=1){const n=P.length-1,a=new Float64Array(n*7);for(let i=0;i<n;i++){a.set([P[i].x,P[i].y,P[i].z,P[i+1].x,P[i+1].y,P[i+1].z,w],i*7);}return a;}
// ideal solenoid: coaxial circular loops (axially symmetric, no net axial current); continuous from 1 loop (t=0) to N loops (t=1)
function idealSegs(t,N){const turns=1+(N-1)*t,n=Math.ceil(turns-1e-9),len=PITCH*t*turns,w=turns/n,parts=[];
  for(let k=0;k<n;k++){const x=n>1?-len/2+len*(k+0.5)/n:0,P=[];for(let i=0;i<=96;i++){const f=-Math.PI+2*Math.PI*i/96;P.push(new THREE.Vector3(x,R0*Math.sin(f),R0*Math.cos(f)));}parts.push(segsOf(P,w));}
  const a=new Float64Array(parts.reduce((m,q)=>m+q.length,0));let o=0;for(const q of parts){a.set(q,o);o+=q.length;}return a;}
// Biot–Savart, exact finite-segment formula, per unit current, s=+1. Units: infinite wire → 1/r
const BO=[0,0,0];
function shapeB(px,py,pz,sg){let bx=0,by=0,bz=0,dmin=1e9;
  for(let i=0;i<sg.length;i+=7){const ax=sg[i],ay=sg[i+1],az=sg[i+2];let ux=sg[i+3]-ax,uy=sg[i+4]-ay,uz=sg[i+5]-az;const L=Math.hypot(ux,uy,uz);ux/=L;uy/=L;uz/=L;
    const r1x=px-ax,r1y=py-ay,r1z=pz-az,t1=r1x*ux+r1y*uy+r1z*uz;const rx=r1x-t1*ux,ry=r1y-t1*uy,rz=r1z-t1*uz;const d2=rx*rx+ry*ry+rz*rz+1e-6;
    const n1=Math.hypot(r1x,r1y,r1z),t2=t1-L,n2=Math.sqrt(d2+t2*t2-1e-6);const f=(t1/n1-t2/n2)/d2*0.5*sg[i+6];
    bx+=(uy*rz-uz*ry)*f;by+=(uz*rx-ux*rz)*f;bz+=(ux*ry-uy*rx)*f;if(n1<dmin)dmin=n1;}
  BO[0]=bx;BO[1]=by;BO[2]=bz;return dmin;}
function fieldAt(p){if(isStraight())return Bstraight(p);shapeB(p.x,p.y,p.z,cur.segs);return new THREE.Vector3(BO[0],BO[1],BO[2]).multiplyScalar(S.s*S.I);}
// seeds: continuous from straight (rings) → loop → solenoid
const DS=[0.35,0.8,1.3,1.75];
function seedsOf(b,t,single){const out=[];
  if(t>0.004||b>0.995){const planes=single?[0]:[0,Math.PI/3,-Math.PI/3];
    const dd=t>0.5?[0.55,1.15,1.75]:DS;for(const a of planes)for(const d of dd)for(const sg of [1,-1]){const y=sg*(R0-d);out.push(new THREE.Vector3(0,y*Math.cos(a),y*Math.sin(a)));}return out;}
  for(const sg of [1,-1]){const sp=sg*LW/4,f=sp*2*Math.PI*b/LW,Rk=b>0.004?LW/(2*Math.PI*b):0;
    const w=b>0.004?new THREE.Vector3(0,Rk*Math.sin(f),R0-Rk*(1-Math.cos(f))-R0*(1-b)):new THREE.Vector3(0,sp,0);
    const n=new THREE.Vector3(0,-Math.sin(f),-Math.cos(f));for(const d of DS)out.push(w.clone().addScaledVector(n,d));}
  return out;}
function traceLine(seed,sg){const step=(p,dir)=>{let dm=shapeB(p[0],p[1],p[2],sg);let m=Math.hypot(BO[0],BO[1],BO[2]);if(m<1e-9)return null;
    const h=Math.min(0.16,Math.max(0.03,0.22*dm))*dir;const mx=p[0]+BO[0]/m*h*0.5,my=p[1]+BO[1]/m*h*0.5,mz=p[2]+BO[2]/m*h*0.5;
    shapeB(mx,my,mz,sg);m=Math.hypot(BO[0],BO[1],BO[2]);if(m<1e-9)return null;return [p[0]+BO[0]/m*h,p[1]+BO[1]/m*h,p[2]+BO[2]/m*h];};
  const run=dir=>{const pts=[[seed.x,seed.y,seed.z]];let p=pts[0],closed=false;
    for(let k=0;k<900;k++){const n=step(p,dir);if(!n)break;pts.push(n);p=n;
      if(Math.hypot(p[0],p[1],p[2])>11.5)break;
      if(k>12&&Math.hypot(p[0]-seed.x,p[1]-seed.y,p[2]-seed.z)<0.12){pts.push([seed.x,seed.y,seed.z]);closed=true;break;}}
    return {pts,closed};};
  const f=run(1);if(f.closed)return f.pts;const bk=run(-1);return bk.pts.reverse().concat(f.pts.slice(1));}
// cache of traced states
const CACHE=new Map();let cur={key:''};
function stateFor(b,t,N,single){const real=S.realHelix&&t>0.004;const key=`${b}|${t}|${N}|${single}|${real}`;let st=CACHE.get(key);if(st)return st;
  const P=wirePts(b,t,N),sg=(t>0.004&&!real)?idealSegs(t,N):segsOf(P);st={key,P,segs:sg,lines:[],b,t,N};
  if(!(b<0.005&&t<0.005)){for(const sd of seedsOf(b,t,single))st.lines.push(traceLine(sd,sg));
    st.compass=[];for(let x=-6;x<=6.01;x+=1.5)for(let y=-4.5;y<=4.51;y+=1.5){const dm=shapeB(x,y,0,sg);if(dm<0.45)continue;const m=Math.hypot(...BO);st.compass.push({p:new THREE.Vector3(x,y,0),d:new THREE.Vector3(BO[0]/m,BO[1]/m,BO[2]/m)});}}
  // magnetic moment direction (∝ Σ r × dl): right-hand rule reference
  const mom=new THREE.Vector3();for(let i=0;i<P.length-1;i++){mom.add(P[i].clone().cross(P[i+1].clone().sub(P[i])));}st.moment=mom;
  shapeB(0,0,0,sg);st.Bc=new THREE.Vector3(...BO);
  const turns=t>0.004?1+(N-1)*t:1;st.len=t>0.004?PITCH*t*turns:0;st.turns=turns;
  if(CACHE.size>260)CACHE.delete(CACHE.keys().next().value);CACHE.set(key,st);return st;}
// ---------- three ----------
const renderer=new THREE.WebGLRenderer({canvas:c3,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,3000);
scene.add(new THREE.AmbientLight(0xffffff,0.8));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(5,10,7);scene.add(dl);
const curMat=new THREE.MeshStandardMaterial({color:COL.light.cur,roughness:.4});
const wireMat=new THREE.MeshStandardMaterial({color:COL.light.cur,roughness:.4,transparent:true});const wire=new THREE.Mesh(new THREE.BufferGeometry(),wireMat);scene.add(wire);
const wireArrows=new THREE.InstancedMesh(new THREE.ConeGeometry(0.27,0.7,20),curMat,64);scene.add(wireArrows);
const planeMat=new THREE.MeshBasicMaterial({color:COL.light.plane,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false});
const plane=new THREE.Mesh(new THREE.PlaneGeometry(13,13),planeMat);plane.rotation.x=-Math.PI/2;scene.add(plane);
const planeEdgeMat=new THREE.LineBasicMaterial({color:COL.light.plane,transparent:true,opacity:.6});
const planeEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(13,13)),planeEdgeMat);planeEdge.rotation.x=-Math.PI/2;scene.add(planeEdge);
// arrow materials (contrasting with field lines), with outline for 黑板模式
const arrowGeo=new THREE.ConeGeometry(0.19,0.5,18);
const outlineMat=new THREE.MeshBasicMaterial({color:COL.light.out,side:THREE.BackSide,transparent:true});
// straight-mode analytic rings
const fieldGroup=new THREE.Group();scene.add(fieldGroup);const rings=[];
for(const y of LAYERS)for(const r of RADII){
  const m=new THREE.MeshStandardMaterial({color:COL.light.fld,transparent:true,roughness:.5,emissive:COL.light.fld,emissiveIntensity:.15});
  const am=new THREE.MeshStandardMaterial({color:COL.light.arr,transparent:true,roughness:.4,emissive:COL.light.arr,emissiveIntensity:.2});
  const om=outlineMat.clone();
  const g=new THREE.Group();const tor=new THREE.Mesh(new THREE.TorusGeometry(r,y===0?0.045:0.03,8,96),m);tor.rotation.x=Math.PI/2;g.add(tor);
  const cones=[];for(let k=0;k<3;k++){const c=new THREE.Mesh(arrowGeo,am);const o=new THREE.Mesh(arrowGeo,om);o.scale.setScalar(1.3);c.add(o);g.add(c);cones.push({mesh:c,ang:k*Math.PI*2/3+y*0.3+r*0.7});}
  g.position.y=y;fieldGroup.add(g);rings.push({g,m,am,om,y,r,cones});}
// traced field lines (Biot–Savart)
const lineMat=new LineMaterial({color:COL.light.fld,linewidth:3.5,transparent:true,opacity:.9,worldUnits:false});
let lineObj=null;
const MAXA=900;const tArrowMat=new THREE.MeshStandardMaterial({color:COL.light.arr,emissive:COL.light.arr,emissiveIntensity:.2});
const tArrows=new THREE.InstancedMesh(arrowGeo,tArrowMat,MAXA);const tArrowsO=new THREE.InstancedMesh(arrowGeo,outlineMat,MAXA);scene.add(tArrows,tArrowsO);
// compass needles: red N, grey/white S
const nMatN=new THREE.MeshStandardMaterial({color:NRED,emissive:NRED,emissiveIntensity:.15}),nMatS=new THREE.MeshStandardMaterial({color:COL.light.sN});
const pivotMat=new THREE.MeshStandardMaterial({color:0x333333});
function makeNeedle(){const g=new THREE.Group();const n=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.42,10),nMatN);n.position.y=0.21;const sm=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.42,10),nMatS);sm.position.y=-0.21;sm.rotation.z=Math.PI;g.add(n,sm,new THREE.Mesh(new THREE.SphereGeometry(0.06,8,6),pivotMat));return g;}
const compassH=new THREE.Group();scene.add(compassH);const needlesH=[];
for(const ly of LAYERS)for(let x=-5;x<=5;x+=1.25)for(let z=-5;z<=5;z+=1.25){const r=Math.hypot(x,z);if(r<0.9||r>5.9)continue;const g=makeNeedle();g.position.set(x,ly+0.05,z);compassH.add(g);needlesH.push({g,p:new THREE.Vector3(x,0,z),ly});}
const compassV=new THREE.Group();scene.add(compassV);const needlesV=[];for(let i=0;i<160;i++){const g=makeNeedle();g.visible=false;compassV.add(g);needlesV.push(g);}
// probe
const probeMat=new THREE.MeshStandardMaterial({color:COL.light.probe,emissive:COL.light.probe,emissiveIntensity:.3});
const probe=new THREE.Mesh(new THREE.SphereGeometry(0.26,24,16),probeMat);scene.add(probe);
const probeArrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,COL.light.arr,0.4,0.28);scene.add(probeArrow);
const rLineMat=new THREE.LineDashedMaterial({color:COL.light.probe,dashSize:.2,gapSize:.15});
const rLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(1,0,0)]),rLineMat);scene.add(rLine);
