<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>向量分量教學工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            touch-action: none; /* 防止在觸控設備上滾動頁面 */
        }
        .label {
            @apply text-sm font-medium text-gray-600 mb-1 block;
        }
        .value {
            @apply text-lg font-bold text-indigo-600;
        }
        .control-panel {
            @apply bg-gray-50 p-4 rounded-lg shadow-md;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4f46e5;
            cursor: pointer;
            border-radius: 50%;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #4f46e5;
            cursor: pointer;
            border-radius: 50%;
        }
        .color-swatch {
            @apply w-10 h-10 rounded-full cursor-pointer border-2 border-transparent transition-transform transform hover:scale-110 flex items-center justify-center flex-shrink-0;
        }
        .color-swatch.selected {
            @apply border-indigo-500 scale-110;
        }
        .number-input {
            @apply w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col lg:flex-row h-screen overflow-hidden">

    <!-- Canvas 區域 -->
    <div class="relative flex-grow flex items-center justify-center p-4 bg-white shadow-inner m-2 rounded-lg">
        <canvas id="mainCanvas" class="border border-gray-300 rounded-lg"></canvas>
        <!-- Logo and Credit -->
        <div class="absolute bottom-3 left-3 flex items-center space-x-2 pointer-events-none opacity-30">
            <svg width="20" height="20" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" stroke="#6b7280" stroke-width="4" fill="#f3f4f6" />
                <text x="50" y="55" font-family="'Noto Sans TC', sans-serif" font-size="50" text-anchor="middle" alignment-baseline="middle" font-weight="bold" fill="#4b5563">平</text>
            </svg>
            <span class="text-gray-500 font-semibold text-sm">平鎮高中 黃世豪</span>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="w-full lg:w-80 p-4 space-y-4 overflow-y-auto bg-white m-2 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center text-gray-800">控制面板</h1>

        <!-- 畫筆工具 -->
        <div class="control-panel">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">畫筆工具</h2>
            <button id="toggleDrawingBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition-colors mb-3">啟用畫筆模式</button>
            <div id="drawingControls" class="hidden">
                <div class="flex justify-around items-center mb-3" id="colorPalette">
                    <button class="color-swatch selected" data-color="#EF4444">
                        <svg class="brush-preview" width="3" height="3"><circle cx="1.5" cy="1.5" r="1.5" fill="#EF4444" /></svg>
                    </button>
                    <button class="color-swatch" data-color="#3B82F6">
                        <svg class="brush-preview" width="3" height="3"><circle cx="1.5" cy="1.5" r="1.5" fill="#3B82F6" /></svg>
                    </button>
                    <button class="color-swatch" data-color="#22C55E">
                        <svg class="brush-preview" width="3" height="3"><circle cx="1.5" cy="1.5" r="1.5" fill="#22C55E" /></svg>
                    </button>
                    <button class="color-swatch" data-color="#000000">
                        <svg class="brush-preview" width="3" height="3"><circle cx="1.5" cy="1.5" r="1.5" fill="#000000" /></svg>
                    </button>
                    <button id="eraserBtn" class="color-swatch" data-color="#FFFFFF">
                         <svg class="brush-preview" width="3" height="3"><circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" stroke="#cccccc" stroke-width="1" /></svg>
                    </button>
                </div>
                <div class="mt-4 mb-3">
                    <label for="brushSize" class="label">筆刷/橡皮擦大小: <span id="brushSizeValue" class="value">3</span></label>
                    <input type="range" id="brushSize" min="1" max="50" value="3">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button id="undoBtn" class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition-colors flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                        <span>上一步</span>
                    </button>
                    <button id="clearDrawingBtn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">清除所有筆跡</button>
                </div>
            </div>
        </div>

        <!-- 顯示設定 -->
        <div class="control-panel">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">顯示設定</h2>
            <div class="flex items-center">
                <input id="toggleValuesCheckbox" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                <label for="toggleValuesCheckbox" class="ml-2 block text-sm text-gray-900">顯示數值與角度</label>
            </div>
        </div>

        <div class="control-panel">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">背景圖片</h2>
            <input type="file" id="bgImageUpload" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
            <div id="bgControls" class="mt-4 space-y-2 hidden">
                <div>
                    <label for="bgScale" class="label">大小: <span id="bgScaleValue" class="value">100</span> %</label>
                    <input type="range" id="bgScale" min="10" max="300" value="100">
                </div>
                <div>
                    <label for="bgOpacity" class="label">透明度: <span id="bgOpacityValue" class="value">100</span> %</label>
                    <input type="range" id="bgOpacity" min="0" max="100" value="100">
                </div>
                <div>
                    <label for="bgOffsetX" class="label">水平位置: <span id="bgOffsetXValue" class="value">0</span> px</label>
                    <input type="range" id="bgOffsetX" min="-300" max="300" value="0">
                </div>
                <div>
                    <label for="bgOffsetY" class="label">垂直位置: <span id="bgOffsetYValue" class="value">0</span> px</label>
                    <input type="range" id="bgOffsetY" min="-300" max="300" value="0">
                </div>
            </div>
            <button id="clearBgBtn" class="mt-2 w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">清除背景</button>
        </div>

        <div class="control-panel">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">主向量 (V)</h2>
            <div>
                <label for="vecLengthInput" class="label">數值大小 (V):</label>
                <input type="number" id="vecLengthInput" class="number-input" step="1">
                <label for="vecLengthSlider" class="label mt-2">視覺長度:</label>
                <input type="range" id="vecLengthSlider" min="0" max="400" value="100">
            </div>
            <div class="mt-2">
                <label for="vecAngle" class="label">角度: <span id="vecAngleValue" class="value">0</span> °</label>
                <input type="range" id="vecAngle" min="0" max="360" value="0">
            </div>
        </div>

        <div class="control-panel">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">座標軸</h2>
            <div>
                <label for="coordAngle" class="label">旋轉角度: <span id="coordAngleValue" class="value">0</span> °</label>
                <input type="range" id="coordAngle" min="0" max="360" value="0">
            </div>
        </div>

        <div class="control-panel">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">分量大小</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="compXInput" class="label">X' 分量 (Vx')</label>
                    <input type="number" id="compXInput" class="number-input" step="0.1">
                </div>
                <div>
                    <label for="compYInput" class="label">Y' 分量 (Vy')</label>
                    <input type="number" id="compYInput" class="number-input" step="0.1">
                </div>
            </div>
        </div>

        <!-- Gemini API 功能面板 -->
        <div class="control-panel">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">✨ AI 輔助學習</h2>
            <p class="text-sm text-gray-500 mb-3">根據目前的向量設定，產生一個相關的物理應用問題。</p>
            <button id="generateProblemBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition-colors flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>
                <span>產生應用問題</span>
            </button>
            <div id="problemOutput" class="mt-3 p-3 bg-gray-100 rounded-md text-sm text-gray-700 min-h-[100px] whitespace-pre-wrap">點擊按鈕來產生問題...</div>
        </div>
        
        <div class="text-xs text-center text-gray-400 pt-4">
            <p>提示：</p>
            <ul class="list-disc list-inside">
                <li>啟用「向量模式」可拖曳向量及座標軸。</li>
                <li>啟用「畫筆模式」可在畫布上自由繪圖。</li>
            </ul>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const drawingCanvas = document.createElement('canvas');
        const drawingCtx = drawingCanvas.getContext('2d');
        
        // DOM 元素
        const vecLengthSlider = document.getElementById('vecLengthSlider');
        const vecLengthInput = document.getElementById('vecLengthInput');
        const vecAngleSlider = document.getElementById('vecAngle');
        const coordAngleSlider = document.getElementById('coordAngle');
        const bgImageUpload = document.getElementById('bgImageUpload');
        const clearBgBtn = document.getElementById('clearBgBtn');
        const bgControls = document.getElementById('bgControls');
        const bgScaleSlider = document.getElementById('bgScale');
        const bgOpacitySlider = document.getElementById('bgOpacity');
        const bgOffsetXSlider = document.getElementById('bgOffsetX');
        const bgOffsetYSlider = document.getElementById('bgOffsetY');

        const vecAngleValue = document.getElementById('vecAngleValue');
        const coordAngleValue = document.getElementById('coordAngleValue');
        const compXInput = document.getElementById('compXInput');
        const compYInput = document.getElementById('compYInput');
        const bgScaleValue = document.getElementById('bgScaleValue');
        const bgOpacityValue = document.getElementById('bgOpacityValue');
        const bgOffsetXValue = document.getElementById('bgOffsetXValue');
        const bgOffsetYValue = document.getElementById('bgOffsetYValue');

        // Gemini API 相關元素
        const generateProblemBtn = document.getElementById('generateProblemBtn');
        const problemOutput = document.getElementById('problemOutput');

        // 畫筆工具相關元素
        const toggleDrawingBtn = document.getElementById('toggleDrawingBtn');
        const drawingControls = document.getElementById('drawingControls');
        const colorPalette = document.getElementById('colorPalette');
        const eraserBtn = document.getElementById('eraserBtn');
        const clearDrawingBtn = document.getElementById('clearDrawingBtn');
        const undoBtn = document.getElementById('undoBtn');
        const brushSizeSlider = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        
        // 顯示設定
        const toggleValuesCheckbox = document.getElementById('toggleValuesCheckbox');
        
        let backgroundImage = null;
        let bgImageSettings = {
            scale: 1,
            opacity: 1,
            offsetX: 0,
            offsetY: 0
        };

        // 視覺狀態 (控制畫布上的箭頭)
        let vector = {
            x: 250,
            y: 250,
            len: 100, // 視覺長度 (pixels)
            angle: 0 // 角度 (degrees)
        };
        
        // 數值狀態 (控制輸入框和計算)
        let numericalValues = {
            len: 100,
            vx: 100,
            vy: 0
        };

        let scaleFactor = 1; // 視覺長度與數值大小的比例尺

        let coordinateSystem = {
            angle: 0 // 角度 (degrees)
        };
        
        let showValuesAndAngle = false;

        // 操作模式狀態
        let dragging = null; // null, 'origin', 'head', 'coord_rotate'
        let angleOffset = 0; 
        let lastMousePos = { x: 0, y: 0 };
        
        // 畫筆狀態
        let isDrawingMode = false;
        let isDrawing = false;
        let currentBrushColor = '#EF4444';
        let brushSize = 3;
        let cursorHintPos = { x: -100, y: -100 };
        let paths = [];
        let currentPath = null;
        
        function redrawDrawingCanvas() {
            drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            drawingCtx.lineCap = 'round';
            drawingCtx.lineJoin = 'round';

            paths.forEach(path => {
                if (path.points.length < 2) return;
                drawingCtx.lineWidth = path.width;
                if (path.color === '#FFFFFF') {
                    drawingCtx.globalCompositeOperation = 'destination-out';
                } else {
                    drawingCtx.globalCompositeOperation = 'source-over';
                    drawingCtx.strokeStyle = path.color;
                }
                drawingCtx.beginPath();
                drawingCtx.moveTo(path.points[0].x, path.points[0].y);
                for (let i = 1; i < path.points.length; i++) {
                    drawingCtx.lineTo(path.points[i].x, path.points[i].y);
                }
                drawingCtx.stroke();
            });
            drawingCtx.globalCompositeOperation = 'source-over';
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawingCanvas.width = canvas.width;
            drawingCanvas.height = canvas.height;
            vector.x = canvas.width / 2;
            vector.y = canvas.height / 2;
            redrawDrawingCanvas();
            updateNumericalsFromVisual();
        }

        function toRadians(degrees) { return degrees * Math.PI / 180; }
        function toDegrees(radians) { return (radians * 180 / Math.PI + 360) % 360; }

        function getVectorHead() {
            const angleRad = toRadians(vector.angle);
            return {
                x: vector.x + vector.len * Math.cos(angleRad),
                y: vector.y + vector.len * Math.sin(angleRad)
            };
        }

        function drawArrow(fromx, fromy, tox, toy, color = 'black', lineWidth = 3) {
            const headlen = 10;
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        function drawCoordinateSystem() {
            const angleRad = toRadians(coordinateSystem.angle);
            const axisLength = Math.min(canvas.width, canvas.height);
            ctx.save();
            ctx.translate(vector.x, vector.y);
            ctx.rotate(angleRad);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(-axisLength, 0); ctx.lineTo(axisLength, 0); ctx.stroke();
            ctx.font = '16px Arial';
            ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.fillText("x'", axisLength - 20, -5);
            ctx.strokeStyle = 'rgba(0, 128, 0, 0.6)';
            ctx.beginPath();
            ctx.moveTo(0, -axisLength); ctx.lineTo(0, axisLength); ctx.stroke();
            ctx.fillStyle = 'rgba(0, 128, 0, 0.8)';
            ctx.fillText("y'", 5, -axisLength + 20);
            ctx.setLineDash([]);
            ctx.restore();
        }

        function drawComponents() {
            const visualRelativeAngleRad = toRadians(vector.angle - coordinateSystem.angle);
            const visualCompX = vector.len * Math.cos(visualRelativeAngleRad);
            const visualCompY = vector.len * Math.sin(visualRelativeAngleRad);
            const coordAngleRad = toRadians(coordinateSystem.angle);
            
            const xCompEnd = { x: vector.x + visualCompX * Math.cos(coordAngleRad), y: vector.y + visualCompX * Math.sin(coordAngleRad) };
            ctx.beginPath(); ctx.setLineDash([2, 3]);
            drawArrow(vector.x, vector.y, xCompEnd.x, xCompEnd.y, '#c026d3', 2);
            
            const yCompEnd = { x: vector.x + visualCompY * Math.cos(coordAngleRad + Math.PI / 2), y: vector.y + visualCompY * Math.sin(coordAngleRad + Math.PI / 2) };
            ctx.beginPath();
            drawArrow(vector.x, vector.y, yCompEnd.x, yCompEnd.y, '#16a34a', 2);
            ctx.setLineDash([]);
            
            const head = getVectorHead();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(xCompEnd.x, xCompEnd.y);
            ctx.lineTo(head.x, head.y);
            ctx.lineTo(yCompEnd.x, yCompEnd.y);
            ctx.stroke(); ctx.setLineDash([]);
        }

        function drawAngleArc() {
            if (!showValuesAndAngle) return;
            ctx.save();
            ctx.translate(vector.x, vector.y);

            const startAngleRad = toRadians(coordinateSystem.angle);
            const endAngleRad = toRadians(vector.angle);
            
            let relativeAngleDeg = vector.angle - coordinateSystem.angle;
            while (relativeAngleDeg <= -180) relativeAngleDeg += 360;
            while (relativeAngleDeg > 180) relativeAngleDeg -= 360;
            const counterClockwise = relativeAngleDeg < 0;
            const arcRadius = 30;
            ctx.strokeStyle = 'rgba(0, 0, 200, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, arcRadius, startAngleRad, endAngleRad, counterClockwise);
            ctx.stroke();
            
            const midAngleRad = startAngleRad + toRadians(relativeAngleDeg / 2);
            const textRadius = arcRadius + 15;
            const textX = textRadius * Math.cos(midAngleRad);
            const textY = textRadius * Math.sin(midAngleRad);
            ctx.font = '14px Arial';
            ctx.fillStyle = 'rgba(0, 0, 200, 0.9)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.abs(relativeAngleDeg).toFixed(1) + '°', textX, textY);
            ctx.restore();
        }

        function drawValueLabels() {
            if (!showValuesAndAngle) return;
            ctx.font = '14px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            const textOffset = 10;
            
            const head = getVectorHead();
            const angleRad = toRadians(vector.angle);
            const offsetX = Math.cos(angleRad) * textOffset;
            const offsetY = Math.sin(angleRad) * textOffset;
            ctx.fillStyle = '#312e81';
            ctx.fillText(numericalValues.len.toFixed(1), head.x + offsetX, head.y + offsetY);
            
            const coordAngleRad = toRadians(coordinateSystem.angle);
            const visualRelativeAngleRad = toRadians(vector.angle - coordinateSystem.angle);
            const visualCompX = vector.len * Math.cos(visualRelativeAngleRad);
            const visualCompY = vector.len * Math.sin(visualRelativeAngleRad);

            const xCompEnd = { x: vector.x + visualCompX * Math.cos(coordAngleRad), y: vector.y + visualCompX * Math.sin(coordAngleRad) };
            const offsetX_compX = Math.cos(coordAngleRad) * textOffset;
            const offsetY_compX = Math.sin(coordAngleRad) * textOffset;
            ctx.fillStyle = '#c026d3';
            ctx.fillText(numericalValues.vx.toFixed(1), xCompEnd.x + offsetX_compX, xCompEnd.y + offsetY_compX);
            
            const yCompEnd = { x: vector.x + visualCompY * Math.cos(coordAngleRad + Math.PI / 2), y: vector.y + visualCompY * Math.sin(coordAngleRad + Math.PI / 2) };
            const offsetX_compY = Math.cos(coordAngleRad + Math.PI / 2) * textOffset;
            const offsetY_compY = Math.sin(coordAngleRad + Math.PI / 2) * textOffset;
            ctx.fillStyle = '#16a34a';
            ctx.fillText(numericalValues.vy.toFixed(1), yCompEnd.x + offsetX_compY, yCompEnd.y + offsetY_compY);
        }
        
        function drawCursorHint() {
            if (isDrawingMode && currentBrushColor === '#FFFFFF' && cursorHintPos.x > 0) {
                ctx.save();
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
                const size = brushSize;
                ctx.strokeRect(cursorHintPos.x - size / 2, cursorHintPos.y - size / 2, size, size);
                ctx.restore();
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (backgroundImage) {
                ctx.globalAlpha = bgImageSettings.opacity;
                const w = canvas.width * bgImageSettings.scale;
                const h = (backgroundImage.height / backgroundImage.width) * w;
                const x = (canvas.width - w) / 2 + bgImageSettings.offsetX;
                const y = (canvas.height - h) / 2 + bgImageSettings.offsetY;
                ctx.drawImage(backgroundImage, x, y, w, h);
                ctx.globalAlpha = 1;
            } else {
                const gridSize = 20;
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 0.5;
                for (let x = 0; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
                for (let y = 0; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            }
            ctx.drawImage(drawingCanvas, 0, 0);
            drawCoordinateSystem();
            drawAngleArc();
            drawComponents();
            const head = getVectorHead();
            drawArrow(vector.x, vector.y, head.x, head.y, '#312e81', 4);
            drawValueLabels();
            drawCursorHint();
        }

        function updateUI() {
            if (document.activeElement !== vecLengthInput) {
                vecLengthInput.value = numericalValues.len.toFixed(1);
            }
            if (document.activeElement !== compXInput) {
                compXInput.value = numericalValues.vx.toFixed(1);
            }
            if (document.activeElement !== compYInput) {
                compYInput.value = numericalValues.vy.toFixed(1);
            }
            
            vecLengthSlider.value = vector.len;
            vecAngleSlider.value = vector.angle;
            vecAngleValue.textContent = vector.angle.toFixed(0);
            coordAngleSlider.value = coordinateSystem.angle;
            coordAngleValue.textContent = coordinateSystem.angle.toFixed(0);
            
            bgScaleSlider.value = bgImageSettings.scale * 100;
            bgScaleValue.textContent = (bgImageSettings.scale * 100).toFixed(0);
            bgOpacitySlider.value = bgImageSettings.opacity * 100;
            bgOpacityValue.textContent = (bgImageSettings.opacity * 100).toFixed(0);
            bgOffsetXSlider.value = bgImageSettings.offsetX;
            bgOffsetXValue.textContent = bgImageSettings.offsetX.toFixed(0);
            bgOffsetYSlider.value = -bgImageSettings.offsetY;
            bgOffsetYValue.textContent = (-bgImageSettings.offsetY).toFixed(0);
            brushSizeSlider.value = brushSize;
            brushSizeValue.textContent = brushSize;
        }

        function updateNumericalsFromVisual() {
            numericalValues.len = vector.len * scaleFactor;
            const relativeAngleRad = toRadians(vector.angle - coordinateSystem.angle);
            numericalValues.vx = numericalValues.len * Math.cos(relativeAngleRad);
            numericalValues.vy = numericalValues.len * Math.sin(relativeAngleRad);
            updateUI();
            draw();
        }

        function updateNumericalsFromLen() {
            numericalValues.len = parseFloat(vecLengthInput.value) || 0;
            const relativeAngleRad = toRadians(vector.angle - coordinateSystem.angle);
            numericalValues.vx = numericalValues.len * Math.cos(relativeAngleRad);
            numericalValues.vy = numericalValues.len * Math.sin(relativeAngleRad);
            if (vector.len > 0) {
                scaleFactor = numericalValues.len / vector.len;
            }
            updateUI();
            draw();
        }

        function updateNumericalsFromVx() {
            const newVx = parseFloat(compXInput.value) || 0;
            const relativeAngleRad = toRadians(vector.angle - coordinateSystem.angle);
            const cos = Math.cos(relativeAngleRad);
            const tan = Math.tan(relativeAngleRad);
            const epsilon = 1e-9;
            if (Math.abs(cos) > epsilon) {
                numericalValues.vy = newVx * tan;
                numericalValues.len = Math.sqrt(Math.pow(newVx, 2) + Math.pow(numericalValues.vy, 2));
            } else {
                numericalValues.vx = 0;
                numericalValues.len = Math.abs(numericalValues.vy);
            }
            if (vector.len > 0) {
                scaleFactor = numericalValues.len / vector.len;
            }
            updateUI();
            draw();
        }

        function updateNumericalsFromVy() {
            const newVy = parseFloat(compYInput.value) || 0;
            const relativeAngleRad = toRadians(vector.angle - coordinateSystem.angle);
            const sin = Math.sin(relativeAngleRad);
            const tan = Math.tan(relativeAngleRad);
            const epsilon = 1e-9;
            if (Math.abs(sin) > epsilon) {
                numericalValues.vx = newVy / tan;
                numericalValues.len = Math.sqrt(Math.pow(numericalValues.vx, 2) + Math.pow(newVy, 2));
            } else {
                numericalValues.vy = 0;
                numericalValues.len = Math.abs(numericalValues.vx);
            }
            if (vector.len > 0) {
                scaleFactor = numericalValues.len / vector.len;
            }
            updateUI();
            draw();
        }

        function updateBrushPreviews() {
            const displaySize = Math.max(4, Math.min(38, brushSize)); 
            const radius = displaySize / 2;
            const svgs = document.querySelectorAll('.brush-preview');
            svgs.forEach(svg => {
                svg.setAttribute('width', displaySize);
                svg.setAttribute('height', displaySize);
                const circle = svg.querySelector('circle');
                if (circle) {
                    circle.setAttribute('cx', radius);
                    circle.setAttribute('cy', radius);
                    if(circle.getAttribute('stroke') !== null) {
                        const strokeWidth = Math.max(1, displaySize / 15);
                        circle.setAttribute('r', radius - strokeWidth / 2); 
                        circle.setAttribute('stroke-width', strokeWidth);
                    } else {
                        circle.setAttribute('r', radius);
                    }
                }
            });
        }
        
        vecLengthSlider.addEventListener('input', (e) => {
            vector.len = parseFloat(e.target.value);
            updateNumericalsFromVisual();
        });
        vecAngleSlider.addEventListener('input', (e) => {
            vector.angle = parseFloat(e.target.value);
            updateNumericalsFromVisual();
        });
        coordAngleSlider.addEventListener('input', (e) => {
            coordinateSystem.angle = parseFloat(e.target.value);
            updateNumericalsFromVisual();
        });

        vecLengthInput.addEventListener('input', updateNumericalsFromLen);
        compXInput.addEventListener('input', updateNumericalsFromVx);
        compYInput.addEventListener('input', updateNumericalsFromVy);
        
        toggleValuesCheckbox.addEventListener('change', (e) => {
            showValuesAndAngle = e.target.checked;
            draw();
        });

        // 背景圖片控制
        bgImageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    backgroundImage = new Image();
                    backgroundImage.onload = () => {
                        bgImageSettings = { scale: 1, opacity: 1, offsetX: 0, offsetY: 0 };
                        bgControls.classList.remove('hidden');
                        updateUI(); draw();
                    };
                    backgroundImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        clearBgBtn.addEventListener('click', () => { backgroundImage = null; bgImageUpload.value = ''; bgControls.classList.add('hidden'); draw(); });
        bgScaleSlider.addEventListener('input', (e) => { bgImageSettings.scale = parseFloat(e.target.value) / 100; updateUI(); draw(); });
        bgOpacitySlider.addEventListener('input', (e) => { bgImageSettings.opacity = parseFloat(e.target.value) / 100; updateUI(); draw(); });
        bgOffsetXSlider.addEventListener('input', (e) => { bgImageSettings.offsetX = parseFloat(e.target.value); updateUI(); draw(); });
        bgOffsetYSlider.addEventListener('input', (e) => { bgImageSettings.offsetY = -parseFloat(e.target.value); updateUI(); draw(); });
        generateProblemBtn.addEventListener('click', generateProblem);

        toggleDrawingBtn.addEventListener('click', () => {
            isDrawingMode = !isDrawingMode;
            if (isDrawingMode) {
                toggleDrawingBtn.textContent = '啟用向量模式';
                toggleDrawingBtn.classList.replace('bg-blue-500', 'bg-green-500');
                toggleDrawingBtn.classList.replace('hover:bg-blue-600', 'hover:bg-green-600');
                drawingControls.classList.remove('hidden');
                updateBrushPreviews();
                if (currentBrushColor === '#FFFFFF') { canvas.style.cursor = 'none'; } 
                else { canvas.style.cursor = 'crosshair'; }
            } else {
                toggleDrawingBtn.textContent = '啟用畫筆模式';
                toggleDrawingBtn.classList.replace('bg-green-500', 'bg-blue-500');
                toggleDrawingBtn.classList.replace('hover:bg-green-600', 'hover:bg-blue-600');
                drawingControls.classList.add('hidden');
                canvas.style.cursor = 'default';
                if (cursorHintPos.x > 0) {
                    cursorHintPos = { x: -100, y: -100 };
                    draw();
                }
            }
        });

        colorPalette.addEventListener('click', (e) => {
            const target = e.target.closest('button');
            if (target && target.dataset.color) {
                currentBrushColor = target.dataset.color;
                colorPalette.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
                target.classList.add('selected');
                if (isDrawingMode) {
                    if (currentBrushColor === '#FFFFFF') { canvas.style.cursor = 'none'; } 
                    else {
                        canvas.style.cursor = 'crosshair';
                        cursorHintPos = { x: -100, y: -100 };
                        draw();
                    }
                }
            }
        });
        function undoLastPath() { if (paths.length > 0) { paths.pop(); redrawDrawingCanvas(); draw(); } }
        clearDrawingBtn.addEventListener('click', () => { paths = []; drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height); draw(); });
        undoBtn.addEventListener('click', undoLastPath);
        brushSizeSlider.addEventListener('input', (e) => { brushSize = parseInt(e.target.value, 10); updateUI(); if (isDrawingMode && currentBrushColor === '#FFFFFF' && !isDrawing) { draw(); } });
        canvas.addEventListener('mouseleave', () => { cursorHintPos = { x: -100, y: -100 }; if (isDrawingMode && currentBrushColor === '#FFFFFF') { draw(); } });

        async function generateProblem() {
            problemOutput.innerHTML = `<div class="flex items-center justify-center"><div class="animate-spin rounded-full h-5 w-5 border-b-2 border-purple-700"></div><span class="ml-2">正在產生問題中...</span></div>`;
            generateProblemBtn.disabled = true;
            generateProblemBtn.classList.add('opacity-50', 'cursor-not-allowed');
            const magnitude = numericalValues.len.toFixed(0);
            const vecAngle = vector.angle.toFixed(0);
            const coordAngle = coordinateSystem.angle.toFixed(0);
            const prompt = `You are a helpful physics tutor for high school students. Based on the following data, create a short and clear physics word problem in Traditional Chinese. The problem should involve vector decomposition. Do not solve the problem, just state it clearly and ask for the components. DATA: - Main vector magnitude: ${magnitude} units. - Main vector angle: ${vecAngle} degrees. - Rotated coordinate system angle: ${coordAngle} degrees. Please provide only the problem statement in Traditional Chinese.`;
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                if (!response.ok) throw new Error(`API 請求失敗，狀態碼：${response.status}`);
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                problemOutput.textContent = text || '無法從 AI 回應中提取有效的問題內容。';
            } catch (error) {
                console.error('Gemini API 呼叫失敗:', error);
                problemOutput.textContent = `產生問題時發生錯誤，請稍後再試。\n詳細資訊: ${error.message}`;
            } finally {
                generateProblemBtn.disabled = false;
                generateProblemBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function getMousePos(e) { const rect = canvas.getBoundingClientRect(); const clientX = e.clientX || e.touches[0].clientX; const clientY = e.clientY || e.touches[0].clientY; return { x: clientX - rect.left, y: clientY - rect.top }; }
        function handleStart(e) {
            e.preventDefault();
            const pos = getMousePos(e);
            lastMousePos = pos;
            if (isDrawingMode) { isDrawing = true; currentPath = { color: currentBrushColor, width: brushSize, points: [pos] }; paths.push(currentPath); } 
            else {
                const head = getVectorHead();
                const distToHead = Math.hypot(pos.x - head.x, pos.y - head.y);
                const distToOrigin = Math.hypot(pos.x - vector.x, pos.y - vector.y);
                if (distToHead < 15) { dragging = 'head'; } 
                else if (distToOrigin < 15) { dragging = 'origin'; } 
                else {
                    const dx = pos.x - vector.x; const dy = pos.y - vector.y;
                    if (Math.hypot(dx, dy) > 20) {
                        const coordAngleRad = toRadians(coordinateSystem.angle);
                        const cosA = Math.cos(-coordAngleRad); const sinA = Math.sin(-coordAngleRad);
                        const rotatedX = dx * cosA - dy * sinA; const rotatedY = dx * sinA + dy * cosA;
                        if (Math.abs(rotatedY) < 10 || Math.abs(rotatedX) < 10) {
                            dragging = 'coord_rotate';
                            const mouseAngleRad = Math.atan2(dy, dx);
                            angleOffset = mouseAngleRad - coordAngleRad;
                        }
                    }
                }
                if (dragging) canvas.style.cursor = 'grabbing';
            }
        }
        function handleMove(e) {
            e.preventDefault();
            if (isDrawingMode) {
                if (!isDrawing) return;
                const pos = getMousePos(e);
                cursorHintPos = pos;
                currentPath.points.push(pos);
                if (currentPath.points.length >= 2) {
                    const p1 = currentPath.points[currentPath.points.length - 2];
                    const p2 = currentPath.points[currentPath.points.length - 1];
                    drawingCtx.lineWidth = currentPath.width; drawingCtx.lineCap = 'round'; drawingCtx.lineJoin = 'round';
                    if (currentPath.color === '#FFFFFF') { drawingCtx.globalCompositeOperation = 'destination-out'; } 
                    else { drawingCtx.globalCompositeOperation = 'source-over'; drawingCtx.strokeStyle = currentPath.color; }
                    drawingCtx.beginPath(); drawingCtx.moveTo(p1.x, p1.y); drawingCtx.lineTo(p2.x, p2.y); drawingCtx.stroke();
                    drawingCtx.globalCompositeOperation = 'source-over';
                }
                draw();
            } else {
                if (!dragging) return;
                const pos = getMousePos(e);
                const dx = pos.x - lastMousePos.x; const dy = pos.y - lastMousePos.y;
                if (dragging === 'origin') { vector.x += dx; vector.y += dy; } 
                else if (dragging === 'head') {
                    const head = getVectorHead();
                    const newDx = (head.x + dx) - vector.x; const newDy = (head.y + dy) - vector.y;
                    vector.len = Math.hypot(newDx, newDy);
                    vector.angle = toDegrees(Math.atan2(newDy, newDx));
                } else if (dragging === 'coord_rotate') {
                    const vec_dx = pos.x - vector.x; const vec_dy = pos.y - vector.y;
                    const newMouseAngleRad = Math.atan2(vec_dy, vec_dx);
                    coordinateSystem.angle = toDegrees(newMouseAngleRad - angleOffset);
                }
                lastMousePos = pos;
                updateNumericalsFromVisual();
            }
        }
        function handleEnd(e) {
            if (isDrawingMode) {
                isDrawing = false; currentPath = null;
                 try { const pos = getMousePos(e); if (currentBrushColor === '#FFFFFF') { cursorHintPos = pos; draw(); }
                } catch(err) { /* Ignored */ }
            } else { dragging = null; updateCursor(e); }
        }
        function updateCursor(e) {
            if (dragging || isDrawingMode) return;
            try {
                const pos = getMousePos(e); const head = getVectorHead();
                const distToHead = Math.hypot(pos.x - head.x, pos.y - head.y);
                const distToOrigin = Math.hypot(pos.x - vector.x, pos.y - vector.y);
                let isOverAxis = false;
                const dx = pos.x - vector.x; const dy = pos.y - vector.y;
                if (Math.hypot(dx, dy) > 20) {
                    const coordAngleRad = toRadians(coordinateSystem.angle);
                    const cosA = Math.cos(-coordAngleRad); const sinA = Math.sin(-coordAngleRad);
                    const rotatedX = dx * cosA - dy * sinA; const rotatedY = dx * sinA + dy * cosA;
                    if (Math.abs(rotatedY) < 10 || Math.abs(rotatedX) < 10) { isOverAxis = true; }
                }
                canvas.style.cursor = (distToHead < 15 || distToOrigin < 15 || isOverAxis) ? 'grab' : 'default';
            } catch(err) { /* Ignored */ }
        }
        function handleCanvasMouseMove(e) {
            const isEraserHintActive = isDrawingMode && !isDrawing && currentBrushColor === '#FFFFFF';
            if (isEraserHintActive) { cursorHintPos = getMousePos(e); }
            if (dragging || isDrawing) { handleMove(e); } 
            else { updateCursor(e); if(isEraserHintActive) { draw(); } }
        }
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleCanvasMouseMove);
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('resize', resizeCanvas);
        
        // 初始化
        resizeCanvas();
    </script>
</body>
</html>
