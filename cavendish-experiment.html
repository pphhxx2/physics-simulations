<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡文狄許實驗 - 步驟 20 (修正讀數邏輯)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f2f5; font-family: 'Noto Sans TC', sans-serif; }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            color: #1f2937;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            pointer-events: auto;
        }
        
        input[type=range] {
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
        }

        button {
            background-color: #4b5563;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 0.9em;
        }
        button:hover { background-color: #374151; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95em; }
        .highlight { color: #dc2626; font-weight: bold; font-family: monospace; font-size: 1.1em; }
        
        .label-group { display: flex; justify-content: space-between; font-size: 0.8em; color: #6b7280; margin-bottom: 5px; }
        .control-section { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; }
        
        .toggle-container {
            display: flex;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }
        .toggle-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        /* 特寫視窗邊框 */
        #inset-border {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            height: 150px;
            border: 4px solid #333;
            background-color: rgba(0,0,0,0.1);
            pointer-events: none;
            display: none;
            box-sizing: border-box;
            z-index: 90;
        }
        #inset-label {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #333;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1 class="text-xl font-bold mb-3 text-gray-800 text-center">
            <div class="mb-1">卡文迪西(Henry Cavendish)</div>
            <div>扭秤實驗</div>
        </h1>
        
        <div id="stats-panel" style="display: none;">
            <div class="stat-row">
                <span>扭秤角度 (θ):</span>
                <span id="angle-display">0.00000°</span>
            </div>
            <div class="stat-row">
                <span>標尺讀數 (光點 X):</span>
                <span id="scale-reading" class="highlight">0.0000 cm</span>
            </div>
        </div>
        
        <div class="control-section">
            <label class="font-bold text-sm block mb-1">大球位置</label>
            <div class="label-group">
                <span>靠近 (5.8)</span>
                <span>遠離 (15.0)</span>
            </div>
            <input type="range" id="separation-slider" min="5.8" max="15.0" step="0.1" value="15.0">
        </div>

        <div class="control-section" id="distance-control-panel" style="display: none;">
            <label class="font-bold text-sm block mb-1">標尺距離</label>
            <div class="label-group">
                <span>近</span>
                <span>遠</span>
            </div>
            <!-- 修改：將最大距離從 80 加倍至 160 -->
            <input type="range" id="distance-slider" min="18" max="160" step="0.5" value="18">
        </div>

        <!-- 系統開關 -->
        <div class="toggle-container">
            <input type="checkbox" id="optical-toggle" class="toggle-checkbox" onchange="toggleOpticalSystem()">
            <label for="optical-toggle" class="font-bold text-sm cursor-pointer">顯示測量系統 (光槓桿)</label>
        </div>

        <!-- 新增：光線開關 (預設隱藏，與系統開關連動) -->
        <div class="toggle-container" id="light-toggle-container" style="display: none; border-top: none; padding-top: 5px; margin-top: 5px; padding-left: 30px;">
            <input type="checkbox" id="light-toggle" class="toggle-checkbox" onchange="toggleLight()">
            <label for="light-toggle" class="font-bold text-sm cursor-pointer text-gray-600">開啟雷射光</label>
        </div>

        <button onclick="resetSimulation()" class="bg-gray-500 hover:bg-gray-400">重置實驗</button>
    </div>

    <!-- 特寫視窗的外框 -->
    <div id="inset-border">
        <div id="inset-label">標尺特寫</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, insetCamera, renderer, controls;
        let torsionGroup, largeSpheresGroup, flashlightGroup;
        let mirrorMesh, laserLineIncident, laserLineReflected, laserSpot;
        let scaleMesh;
        
        // 狀態變數
        let isOpticalSystemVisible = false;
        let isLightOn = false;

        const insetWidth = 300;
        const insetHeight = 150;

        let physics = {
            theta: 0,           
            omega: 0,           
            alpha: 0,           
            torsionK: 40000.0,        
            momentOfInertia: 10000, 
            damping: 0.92,        
            G_sim: 100.0,          
            currentSeparation: 15.0, 
            targetSeparation: 15.0,
            scaleDistance: 18.0, 
        };

        const params = {
            rodLength: 10,
            wireHeight: 8,
            smallMassRadius: 0.6,
            largeMassRadius: 2.0,
            zOffset: 3.2,
            flashlightX: -1.0,     
            flashlightFixedZ: 15.0 
        };

        const angleEl = document.getElementById('angle-display');
        const scaleReadingEl = document.getElementById('scale-reading');
        const sepSliderEl = document.getElementById('separation-slider');
        const distSliderEl = document.getElementById('distance-slider');
        const statsPanel = document.getElementById('stats-panel');
        const distControlPanel = document.getElementById('distance-control-panel');
        const insetBorder = document.getElementById('inset-border');
        const lightToggleContainer = document.getElementById('light-toggle-container');

        sepSliderEl.addEventListener('input', (e) => {
            physics.targetSeparation = parseFloat(e.target.value);
        });

        distSliderEl.addEventListener('input', (e) => {
            physics.scaleDistance = parseFloat(e.target.value);
        });

        // 系統顯示切換
        window.toggleOpticalSystem = function() {
            const checkbox = document.getElementById('optical-toggle');
            isOpticalSystemVisible = checkbox.checked;
            updateVisibility();
        };

        // 光線開關切換
        window.toggleLight = function() {
            const checkbox = document.getElementById('light-toggle');
            isLightOn = checkbox.checked;
            updateVisibility();
        };

        function updateVisibility() {
            // UI 面板控制
            statsPanel.style.display = isOpticalSystemVisible ? 'block' : 'none';
            distControlPanel.style.display = isOpticalSystemVisible ? 'block' : 'none';
            insetBorder.style.display = isOpticalSystemVisible ? 'block' : 'none';
            // 光線開關只有在系統顯示時才出現
            lightToggleContainer.style.display = isOpticalSystemVisible ? 'flex' : 'none';

            // 裝置模型控制
            if (mirrorMesh) mirrorMesh.visible = isOpticalSystemVisible;
            if (scaleMesh) scaleMesh.visible = isOpticalSystemVisible;
            if (flashlightGroup) flashlightGroup.visible = isOpticalSystemVisible;

            // 雷射光控制 (需同時滿足：系統顯示且光線開啟)
            const showLaser = isOpticalSystemVisible && isLightOn;
            
            if (laserLineIncident) laserLineIncident.visible = showLaser;
            if (laserLineReflected) laserLineReflected.visible = showLaser;
            if (laserSpot) laserSpot.visible = showLaser;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f2f5); 
            
            // 修改：加大地板網格範圍 (200 -> 400) 以適應更遠的標尺距離
            const gridHelper = new THREE.GridHelper(400, 100, 0xcccccc, 0xe5e7eb);
            gridHelper.position.y = -5;
            scene.add(gridHelper);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, -45); 
            camera.lookAt(0, 0, 0); 

            // 特寫攝影機
            insetCamera = new THREE.PerspectiveCamera(20, insetWidth / insetHeight, 1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.autoClear = false; 
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xe0e7ff, 0.5);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; 

            createApparatus();
            createOpticalSystem(); 
            
            updateVisibility();
            
            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createApparatus() {
            const leadMaterial = new THREE.MeshStandardMaterial({ color: 0xbdc3c7, roughness: 0.2, metalness: 0.6 });
            const rodMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.5 });
            const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 });

            torsionGroup = new THREE.Group();
            scene.add(torsionGroup);

            const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, params.wireHeight, 8), wireMaterial);
            wire.position.y = params.wireHeight / 2;
            torsionGroup.add(wire);

            const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, params.rodLength, 16), rodMaterial);
            rod.rotation.z = Math.PI / 2;
            torsionGroup.add(rod);

            const mirrorGeo = new THREE.BoxGeometry(1.2, 1.2, 0.1); 
            const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.0 });
            mirrorMesh = new THREE.Mesh(mirrorGeo, mirrorMat);
            mirrorMesh.position.y = 1.5; 
            torsionGroup.add(mirrorMesh);
            
            const sbGeo = new THREE.SphereGeometry(params.smallMassRadius, 64, 64);
            const sb1 = new THREE.Mesh(sbGeo, leadMaterial);
            sb1.position.x = params.rodLength / 2; 
            sb1.castShadow = true;
            torsionGroup.add(sb1);

            const sb2 = new THREE.Mesh(sbGeo, leadMaterial);
            sb2.position.x = -params.rodLength / 2; 
            sb2.castShadow = true;
            torsionGroup.add(sb2);

            largeSpheresGroup = new THREE.Group();
            scene.add(largeSpheresGroup);

            const lbGeo = new THREE.SphereGeometry(params.largeMassRadius, 64, 64);
            const lb1 = new THREE.Mesh(lbGeo, leadMaterial);
            lb1.castShadow = true;
            largeSpheresGroup.add(lb1);

            const lb2 = new THREE.Mesh(lbGeo, leadMaterial);
            lb2.castShadow = true;
            largeSpheresGroup.add(lb2);
            
            const railGeo = new THREE.BoxGeometry(20, 0.1, 0.5);
            const railMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            
            const rail1 = new THREE.Mesh(railGeo, railMat);
            rail1.position.set(10, -params.largeMassRadius - 0.1, params.zOffset);
            scene.add(rail1);
            
            const rail2 = new THREE.Mesh(railGeo, railMat);
            rail2.position.set(-10, -params.largeMassRadius - 0.1, -params.zOffset);
            scene.add(rail2);
        }

        function createOpticalSystem() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; 
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 2048, 128);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            
            const totalTicks = 200;
            for(let i=0; i<=totalTicks; i++) {
                const x = i * (2048/totalTicks);
                const height = (i % 10 === 0) ? 60 : (i % 5 === 0 ? 40 : 20);
                ctx.fillRect(x, 0, 2, height);
                if (i % 10 === 0) {
                    const labelVal = i - 100; 
                    ctx.fillText(labelVal, x, 90); 
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            
            const scaleGeo = new THREE.PlaneGeometry(40, 3);
            const scaleMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            scaleMesh = new THREE.Mesh(scaleGeo, scaleMat);
            scaleMesh.position.set(0, 1.5, physics.scaleDistance); 
            scaleMesh.rotation.y = Math.PI; 
            scene.add(scaleMesh);

            flashlightGroup = new THREE.Group();
            scene.add(flashlightGroup);

            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333 }); 
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2; 
            flashlightGroup.add(body);

            const headGeo = new THREE.CylinderGeometry(0.5, 0.3, 0.5, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x111111 }); 
            const head = new THREE.Mesh(headGeo, headMat);
            head.rotation.x = Math.PI / 2;
            head.position.z = -0.8; 
            flashlightGroup.add(head);

            const bulbGeo = new THREE.CircleGeometry(0.4, 16);
            const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffaaaa }); 
            const bulb = new THREE.Mesh(bulbGeo, bulbMat);
            bulb.position.z = -1.06;
            flashlightGroup.add(bulb);

            flashlightGroup.position.set(params.flashlightX, 1.5, params.flashlightFixedZ);
            flashlightGroup.lookAt(0, 1.5, 0);

            const laserMat = new THREE.LineBasicMaterial({ color: 0xdc2626, linewidth: 2 }); 
            
            const incidentPoints = [
                new THREE.Vector3(params.flashlightX, 1.5, params.flashlightFixedZ), 
                new THREE.Vector3(0, 1.5, 0)
            ];
            laserLineIncident = new THREE.Line(new THREE.BufferGeometry().setFromPoints(incidentPoints), laserMat);
            // 強制不進行視錐體剔除
            laserLineIncident.frustumCulled = false;
            scene.add(laserLineIncident);

            const reflectedPoints = [
                new THREE.Vector3(0, 1.5, 0),
                new THREE.Vector3(0, 1.5, physics.scaleDistance)
            ];
            laserLineReflected = new THREE.Line(new THREE.BufferGeometry().setFromPoints(reflectedPoints), laserMat);
            // 強制不進行視錐體剔除
            laserLineReflected.frustumCulled = false;
            scene.add(laserLineReflected);

            laserSpot = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            scene.add(laserSpot);
        }

        function updatePhysics() {
            const lerpSpeed = 0.05;
            physics.currentSeparation += (physics.targetSeparation - physics.currentSeparation) * lerpSpeed;
            const zOffset = params.zOffset; 

            largeSpheresGroup.children[0].position.set(physics.currentSeparation, 0, zOffset);
            largeSpheresGroup.children[1].position.set(-physics.currentSeparation, 0, -zOffset);

            // 更新標尺位置
            scaleMesh.position.z = physics.scaleDistance;
            
            // 更新特寫攝影機位置 (修正為俯視角度)
            insetCamera.position.set(2.5, 6.5, physics.scaleDistance - 22); 
            insetCamera.lookAt(2.5, 1.5, physics.scaleDistance);

            const r = params.rodLength / 2;
            const sb1_pos = new THREE.Vector3(r * Math.cos(physics.theta), 0, -r * Math.sin(physics.theta));
            const sb2_pos = new THREE.Vector3(-r * Math.cos(physics.theta), 0, r * Math.sin(physics.theta));
            
            const lb1_pos = largeSpheresGroup.children[0].position;
            const lb2_pos = largeSpheresGroup.children[1].position;

            const calcTorque = (sb_pos, lb_pos) => {
                const distSq = sb_pos.distanceToSquared(lb_pos);
                const safeDistSq = Math.max(distSq, 1.0); 
                const F = physics.G_sim / safeDistSq;
                
                const forceDir = new THREE.Vector3().subVectors(lb_pos, sb_pos).normalize();
                const forceVec = forceDir.multiplyScalar(F);
                const torqueVec = new THREE.Vector3().crossVectors(sb_pos, forceVec);
                return torqueVec.y; 
            };

            const gravityTorque = calcTorque(sb1_pos, lb1_pos) + calcTorque(sb2_pos, lb2_pos);
            const restoreTorque = -physics.torsionK * physics.theta;
            const totalTorque = gravityTorque + restoreTorque;

            physics.alpha = totalTorque / physics.momentOfInertia;
            
            if (isNaN(physics.alpha) || !isFinite(physics.alpha)) {
                physics.alpha = 0;
                physics.omega = 0;
                physics.theta = 0;
            }

            physics.omega += physics.alpha;
            physics.omega *= physics.damping; 
            physics.theta += physics.omega;
            
            torsionGroup.rotation.y = physics.theta;

            const sourcePos = new THREE.Vector3(params.flashlightX, 1.5, params.flashlightFixedZ);
            const targetPos = new THREE.Vector3(0, 1.5, 0);
            const incident = new THREE.Vector3().subVectors(targetPos, sourcePos).normalize();

            const normal = new THREE.Vector3(0, 0, 1);
            normal.applyAxisAngle(new THREE.Vector3(0, 1, 0), physics.theta);
            
            const reflectedDir = incident.clone().reflect(normal).normalize();
            
            let spotX = 0;
            if (reflectedDir.z > 0.001) {
                const t = physics.scaleDistance / reflectedDir.z;
                const intersection = reflectedDir.clone().multiplyScalar(t);
                spotX = intersection.x;
                
                if (isOpticalSystemVisible) {
                    const positions = laserLineReflected.geometry.attributes.position.array;
                    positions[0] = 0; positions[1] = 1.5; positions[2] = 0;
                    positions[3] = intersection.x; 
                    positions[4] = 1.5; 
                    positions[5] = intersection.z;
                    laserLineReflected.geometry.attributes.position.needsUpdate = true;

                    laserSpot.position.set(intersection.x, 1.5, intersection.z - 0.1);
                }
            }

            angleEl.innerText = (physics.theta * 180 / Math.PI).toFixed(5) + "°"; 
            
            // 修正：只有在光線開啟時才顯示讀數
            if (isLightOn) {
                scaleReadingEl.innerText = (-spotX * 5).toFixed(4) + " cm"; 
            } else {
                scaleReadingEl.innerText = "---"; 
            }
        }

        window.resetSimulation = function() {
            physics.theta = 0;
            physics.omega = 0;
            physics.alpha = 0;
            physics.targetSeparation = 15.0; 
            physics.currentSeparation = 15.0;
            physics.scaleDistance = 18.0;   
            
            sepSliderEl.value = 15.0;
            distSliderEl.value = 18.0;
            torsionGroup.rotation.y = 0;
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            
            // 渲染主畫面
            renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
            renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
            renderer.setScissorTest(false);
            renderer.render(scene, camera);

            // 渲染特寫畫面 (僅在開啟光學系統時)
            if (isOpticalSystemVisible) {
                const x = window.innerWidth - insetWidth - 20;
                const y = window.innerHeight - insetHeight - 20; 
                
                renderer.clearDepth(); 
                renderer.setScissorTest(true);
                renderer.setScissor(x, y, insetWidth, insetHeight);
                renderer.setViewport(x, y, insetWidth, insetHeight);
                renderer.render(scene, insetCamera);
                renderer.setScissorTest(false);
            }
        }

        init();
    </script>
</body>
</html>
