<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>單狹縫繞射</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#1b2430;--muted:#5a6878;--line:#cfd8e3;--btn:#f3f6fa;--btnh:#e3ebf5;--on:#1f6fd6;--cap:#fffbe8;--crest:#1f5fd0;--trough:#e0702a;--dark:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
#app{display:grid;grid-template-columns:1fr 320px;height:100vh}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#title{padding:6px 14px;font-size:22px;font-weight:800}
#view{position:relative;flex:1;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f7f9fc;touch-action:none}
#view canvas{position:absolute;display:block}
#gl{left:0;top:0}
#ov{left:0;top:0;width:100%;height:100%}
#caption{padding:8px 14px;font-size:19px;font-weight:600;background:var(--cap);min-height:44px;display:grid}#caption>span{grid-area:1/1}
#side{overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 10px;font-size:15px}
.sec{margin-bottom:10px}.sec h3{margin:3px 0 6px;font-size:15px;color:var(--muted)}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
button{font:inherit;font-size:15px;padding:6px 9px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:7px;cursor:pointer;user-select:none;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}.ord{gap:4px}.ost{padding:3px 8px;font-size:15px}.ov{min-width:92px;text-align:center;font-weight:700;font-size:14px}button:hover{background:var(--btnh)}button.on{background:var(--on);color:#fff;border-color:var(--on)}
label.sl{min-width:104px;font-weight:700;white-space:nowrap}input[type=range]{flex:1;min-width:70px}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px solid #1b2430;vertical-align:-3px;margin-right:3px}
input#lam{-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0}
#lam::-webkit-slider-runnable-track{height:9px;border-radius:5px;border:1px solid #9aa4ae;background:var(--spec)}
#lam::-moz-range-track{height:9px;border-radius:5px;border:1px solid #9aa4ae;background:var(--spec)}
#lam::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:21px;margin-top:-7px;border-radius:5px;background:#fff;border:2px solid #1b2430}
#lam::-moz-range-thumb{width:11px;height:17px;border-radius:5px;background:#fff;border:2px solid #1b2430}
.big{font-size:19px;font-weight:800;color:var(--on)}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:3px}
@media (max-width:820px){#app{grid-template-columns:1fr;height:auto}#main{height:72vh}#side{border-left:none;border-top:1px solid var(--line)}}
#title{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}#title .tt{flex:1 1 auto}#title .pb{display:flex;gap:6px}#title .pb button{font-size:15px;font-weight:700;padding:4px 10px}
.imo{position:fixed;inset:0;z-index:50;background:rgba(238,242,247,.94);display:none;align-items:center;justify-content:center;padding:1vh 1vw}.imo.open{display:flex}
.imo .bx{display:flex;width:100%;height:100%;align-items:center;justify-content:center}.imo img{display:block;width:100%;height:100%;object-fit:contain;background:transparent}
.imo .x{position:absolute;top:8px;right:12px;z-index:2;font-size:20px;font-weight:800;width:40px;height:40px;padding:0;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="app">
 <div id="main">
  <div id="title"><span class="tt">單狹縫繞射</span><span class="pb"><button id="bCmp">單雙狹縫條紋比較</button></span></div>
  <div id="view"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
  <div id="caption"><span id="capA"></span><span id="capS">a ≲ λ：沒有暗紋，光幾乎均勻散開</span><span id="capL">a ≫ λ：中央亮紋很窄，接近幾何陰影</span></div>
 </div>
 <div id="side">
  <div class="sec"><h3>參數</h3>
   <div class="row"><label class="sl">波長 λ <span class="sw" id="sw"></span><span id="lv"></span></label><button class="hold" data-k="nm" data-s="-1">－</button><input type="range" id="lam" min="380" max="750" step="1"><button class="hold" data-k="nm" data-s="1">＋</button></div>
   <div class="row"><label class="sl">縫寬 a <span id="av"></span></label><button class="hold" data-k="a" data-s="-1">－</button><input type="range" id="a" min="0" max="100" step="0.25"><button class="hold" data-k="a" data-s="1">＋</button></div>
   <div class="row"><label class="sl">屏距 L <span id="Lv"></span></label><button class="hold" data-k="L" data-s="-0.5">－</button><input type="range" id="L" min="10" max="26" step="0.1"><button class="hold" data-k="L" data-s="0.5">＋</button></div>
   <div>a/λ = <b id="al" class="big"></b>　中央亮紋寬 ≈ 2Lλ/a = <b id="cw"></b></div></div>
  <div class="sec"><h3>遠屏近似</h3>
   <div class="row"><button id="tPar">平行光近似（L ≫ a）</button></div>
   <div id="parBox" style="display:none">
    <div class="row"><label class="sl">θ <span id="thv"></span>°</label><button class="hold" data-k="th" data-s="-0.1">－</button><input type="range" id="th" min="0" max="50" step="0.1"><button class="hold" data-k="th" data-s="0.1">＋</button></div>
    <div class="row"><label class="sl">L = <span id="ldv"></span>a</label><button class="hold" data-k="lg" data-s="-2">－</button><input type="range" id="lg" min="0" max="100" step="1"><button class="hold" data-k="lg" data-s="2">＋</button></div>
    <div class="row"><button id="tWave" class="on">橫波示意</button><button id="tZone" class="on">分帶</button></div>
    <div class="row ord"><span style="font-weight:700">高亮光線</span><button class="ost" id="hlM">‹</button><span id="hlV" class="ov">全部</span><button class="ost" id="hlP">›</button></div>
    <div class="row ord"><button id="snapD">θ 對齊暗紋</button><button class="ost" id="odM">‹</button><span id="odV" class="ov"></span><button class="ost" id="odP">›</button></div>
    <div class="row ord"><button id="snapB">θ 對齊亮紋</button><button class="ost" id="obM">‹</button><span id="obV" class="ov"></span><button class="ost" id="obP">›</button></div>
   </div></div>
  <div class="sec"><h3>顯示</h3>
   <div class="row"><button id="tSrc">子波源</button><button id="tDir" class="on"><span class="lg" style="background:var(--dark)"></span>暗紋方向</button></div>
   <div class="row"><span><span class="lg" style="background:var(--crest)"></span>波峰</span><span><span class="lg" style="background:var(--trough)"></span>波谷</span><span><span class="lg" style="background:#e9edf2;border:1px solid #bbb"></span>平靜</span></div></div>
  <div class="sec"><h3>動畫</h3>
   <div class="row"><button id="play" class="on">❚❚ 暫停</button></div>
   <div class="row"><label class="sl">速度 <span id="spv"></span></label><button class="hold" data-k="sp" data-s="-0.1">－</button><input type="range" id="sp" min="0.1" max="2" step="0.1"><button class="hold" data-k="sp" data-s="0.1">＋</button></div></div>
  <div class="sec"><h3>探針</h3><div id="probeTxt" style="font-size:17px;font-weight:700;line-height:1.45"></div><div style="font-size:13px;color:var(--muted)">拖曳紫色點（場中或屏幕上）</div></div>
 </div>
</div>

const XS=6,XMAX=XS+26+1.2,NSH=32;          // slit x; world width; # Huygens wavelets in the shader
const SM=[1.4303,2.4590,3.4709,4.4774,5.4818,6.4844,7.4865,8.4880]; // secondary maxima: tanβ=β, a sinθ/λ values

const NM_K=0.0016,NM_MIN=380,NM_MAX=750;   // world units per nm (500 nm = 0.8 u); 1 u = 0.625 µm
function wl2rgb(nm){nm=Math.max(NM_MIN,Math.min(NM_MAX,nm));let r=0,g=0,b=0;

// drags: wavefront (construction view) or probe (main view) — never both
let drag=false;
function wMove(px,py){if(!WFG)return;const g=WFG,u=(px-g.T[0])*g.e[0]+(py-g.T[1])*g.e[1];WFf=Math.max(0,Math.min(1,u/g.umax));}
$('view').addEventListener('pointerdown',e=>{const r=$('view').getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  if(par){if(PG&&Math.abs(px-PG.rays[0].S[0])<16){let best=null,bd=1e9;for(const r of PG.rays){const d=Math.abs(py-r.S[1]);if(d<bd){bd=d;best=r;}}if(best&&bd<Math.max(8,PG.sp/2+1)){HL=HL===best.cls?-1:best.cls;hlUI();e.preventDefault();return;}}
    if(WFG&&px<(NARROW?W:TW)){const a2=WFG.p2,b2=WFG.p1,vx=b2[0]-a2[0],vy=b2[1]-a2[1],L2=vx*vx+vy*vy||1,k=Math.max(-0.2,Math.min(1.2,((px-a2[0])*vx+(py-a2[1])*vy)/L2)),dd=Math.hypot(px-a2[0]-k*vx,py-a2[1]-k*vy);
      if(dd<(e.pointerType==='touch'?26:15)){wdrag=true;dragged=true;e.preventDefault();$('view').setPointerCapture(e.pointerId);}}
    if(!wdrag&&!NARROW&&px>stripX&&px<stripX+stripW){drag=true;$('view').setPointerCapture(e.pointerId);move(px,py);}return;}
  if(Math.hypot(px-X(probe.x),py-Yp(probe.y))<(e.pointerType==='touch'?30:22)||(px>stripX&&px<stripX+stripW)){drag=true;$('view').setPointerCapture(e.pointerId);move(px,py);}});
$('view').addEventListener('pointermove',e=>{const r=$('view').getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;if(wdrag)wMove(px,py);else if(drag)move(px,py);});
['pointerup','pointercancel'].forEach(t=>$('view').addEventListener(t,()=>{drag=false;wdrag=false;}));
function move(px,py){let [x,y]=toW(Math.min(px,X(XS+P.L)),py);const on=par||px>=X(XS+P.L)-12;setProbe(x,y,on);}
function setProbe(x,y,onScreen){probe.onScreen=!!onScreen;probe.x=onScreen?XS+P.L:Math.max(XS+0.5,Math.min(XS+P.L,x));probe.y=Math.max(-Y0+0.3,Math.min(Y0-0.3,y));}
function probeInfo(){const D=edgeDiff(probe.x,probe.y)/P.lam,r=Math.hypot(probe.x-XS,probe.y),x=P.a/P.lam*probe.y/r,F=P.a*P.a/(P.lam*r);return {D,x,t:F>3.75?'近場：不適用遠場條件':verdict(x)};}
// ---------- loop ----------
let last=performance.now(),frames=0,cost=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;frames++;if(playing)phase+=dt*2*Math.PI*P.sp*1.2;if(probe.onScreen)probe.x=XS+P.L;
  const t0=performance.now();drawField();drawOverlay();cost=cost*0.95+(performance.now()-t0)*0.05;
  const pi=probeInfo();$('probeTxt').innerHTML=`邊緣光程差 Δ = ${f2(pi.D)}λ<br>a sinθ = ${f2(pi.x)}λ → ${pi.t}`;
  const fd=fades();let capA='暗紋：a sinθ = mλ（m = ±1, ±2…）；中央亮紋寬為其他亮紋的 2 倍';let cs=fd.small,cl=fd.large;
  if(par){capA=LdOf()<10?`L 只有 ${Math.round(LdOf())}a：光線不平行，Δ 與 a sinθ 有差距`:'L ≫ a：光線近似平行；上下半縫配對差 λ/2 → 兩兩抵消 → 暗';cs=0;cl=0;}
  {const cd=par?'none':'';if($('caption').style.display!==cd)$('caption').style.display=cd;}OP.cap=cs+cl;if($('capA').textContent!==capA)$('capA').textContent=capA;$('capA').style.opacity=1-cs-cl;$('capS').style.opacity=cs;$('capL').style.opacity=cl;
  requestAnimationFrame(frame);}
fmt();layout();setProbe(0,darkY(1)||4,true);requestAnimationFrame(frame);

  orders:()=>({ordD,ordB,...ordMax(),sel:SEL}),setHL:v=>{HL=v;hlUI();},hl:()=>HL,zt:()=>ZT,opac:()=>({...OP}),aa:()=>AA,verd:()=>VERD,toggle:id=>$(id).click(),
  state:()=>({lam:P.lam,a:P.a,L:P.L,th:P.th,probeTxt:$('probeTxt').textContent,frames,cost,caption:OP.small>0.5?$('capS').textContent:OP.large>0.5?$('capL').textContent:$('capA').textContent}),
  screenMinima:(lim=14,st=0.004)=>{const xs=XS+P.L,N=NJ(),out=[];let pp=-1,prev=-1;for(let y=-lim;y<=lim;y+=st){const v=intensity(xs,y,N);if(pp>=0&&prev<pp&&prev<v)out.push(+(y-st).toFixed(3));pp=prev;prev=v;}return out;}};
