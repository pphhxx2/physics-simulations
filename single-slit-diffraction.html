<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>單狹縫繞射</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#1b2430;--muted:#5a6878;--line:#cfd8e3;--btn:#f3f6fa;--btnh:#e3ebf5;--on:#1f6fd6;--cap:#fffbe8;--crest:#1f5fd0;--trough:#e0702a;--dark:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
#app{display:grid;grid-template-columns:1fr 320px;height:100vh}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#title{padding:6px 14px;font-size:22px;font-weight:800}
#view{position:relative;flex:1;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f7f9fc;touch-action:none}
#view canvas{position:absolute;display:block}
#gl{left:0;top:0}
#ov{left:0;top:0;width:100%;height:100%}
#caption{padding:8px 14px;font-size:19px;font-weight:600;background:var(--cap);min-height:44px;display:grid}#caption>span{grid-area:1/1}
#side{overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 10px;font-size:15px}
.sec{margin-bottom:10px}.sec h3{margin:3px 0 6px;font-size:15px;color:var(--muted)}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
button{font:inherit;font-size:15px;padding:6px 9px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:7px;cursor:pointer;user-select:none;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}.ord{gap:4px}.ost{padding:3px 8px;font-size:15px}.ov{min-width:92px;text-align:center;font-weight:700;font-size:14px}button:hover{background:var(--btnh)}button.on{background:var(--on);color:#fff;border-color:var(--on)}
label.sl{min-width:92px;font-weight:700}input[type=range]{flex:1;min-width:70px}
.big{font-size:19px;font-weight:800;color:var(--on)}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:3px}
@media (max-width:820px){#app{grid-template-columns:1fr;height:auto}#main{height:72vh}#side{border-left:none;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
 <div id="main">
  <div id="title">單狹縫繞射</div>
  <div id="view"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
  <div id="caption"><span id="capA"></span><span id="capS">a ≲ λ：沒有暗紋，光幾乎均勻散開</span><span id="capL">a ≫ λ：中央亮紋很窄，接近幾何陰影</span></div>
 </div>
 <div id="side">
  <div class="sec"><h3>參數</h3>
   <div class="row"><label class="sl">波長 λ <span id="lv"></span></label><button class="hold" data-k="lam" data-s="-0.05">－</button><input type="range" id="lam" min="0.3" max="3" step="0.01"><button class="hold" data-k="lam" data-s="0.05">＋</button></div>
   <div class="row"><label class="sl">縫寬 a <span id="av"></span></label><button class="hold" data-k="a" data-s="-1">－</button><input type="range" id="a" min="0" max="100" step="0.25"><button class="hold" data-k="a" data-s="1">＋</button></div>
   <div class="row"><label class="sl">屏距 L <span id="Lv"></span></label><button class="hold" data-k="L" data-s="-0.5">－</button><input type="range" id="L" min="10" max="26" step="0.1"><button class="hold" data-k="L" data-s="0.5">＋</button></div>
   <div>a/λ = <b id="al" class="big"></b>　中央亮紋寬 ≈ 2Lλ/a = <b id="cw"></b></div></div>
  <div class="sec"><h3>遠屏近似</h3>
   <div class="row"><button id="tPar">平行光近似（L ≫ a）</button></div>
   <div id="parBox" style="display:none">
    <div class="row"><label class="sl">θ <span id="thv"></span>°</label><button class="hold" data-k="th" data-s="-0.1">－</button><input type="range" id="th" min="0" max="50" step="0.1"><button class="hold" data-k="th" data-s="0.1">＋</button></div>
    <div class="row"><label class="sl">L = <span id="ldv"></span>a</label><button class="hold" data-k="lg" data-s="-2">－</button><input type="range" id="lg" min="0" max="100" step="1"><button class="hold" data-k="lg" data-s="2">＋</button></div>
    <div class="row"><button id="tWave" class="on">橫波示意</button><button id="tZone" class="on">分帶</button></div>
    <div class="row ord"><span style="font-weight:700">高亮光線</span><button class="ost" id="hlM">‹</button><span id="hlV" class="ov">全部</span><button class="ost" id="hlP">›</button></div>
    <div class="row ord"><button id="snapD">θ 對齊暗紋</button><button class="ost" id="odM">‹</button><span id="odV" class="ov"></span><button class="ost" id="odP">›</button></div>
    <div class="row ord"><button id="snapB">θ 對齊亮紋</button><button class="ost" id="obM">‹</button><span id="obV" class="ov"></span><button class="ost" id="obP">›</button></div>
   </div></div>
  <div class="sec"><h3>顯示</h3>
   <div class="row"><button id="tSrc">子波源</button><button id="tDir" class="on"><span class="lg" style="background:var(--dark)"></span>暗紋方向</button></div>
   <div class="row"><span><span class="lg" style="background:var(--crest)"></span>波峰</span><span><span class="lg" style="background:var(--trough)"></span>波谷</span><span><span class="lg" style="background:#e9edf2;border:1px solid #bbb"></span>平靜</span></div></div>
  <div class="sec"><h3>動畫</h3>
   <div class="row"><button id="play" class="on">❚❚ 暫停</button></div>
   <div class="row"><label class="sl">速度 <span id="spv"></span></label><button class="hold" data-k="sp" data-s="-0.1">－</button><input type="range" id="sp" min="0.1" max="2" step="0.1"><button class="hold" data-k="sp" data-s="0.1">＋</button></div></div>
  <div class="sec"><h3>探針</h3><div id="probeTxt" style="font-size:17px;font-weight:700;line-height:1.45"></div><div style="font-size:13px;color:var(--muted)">拖曳紫色點（場中或屏幕上）</div></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const P={lam:0.8,a:3.2,L:20,sp:0.6,th:12,lg:40};let par=false,wave=true,zones=true,showSrc=false,showDir=true,playing=true,phase=0;
const XS=6,XMAX=XS+26+1.2,NSH=32;          // slit x; world width; # Huygens wavelets in the shader
const SM=[1.4303,2.4590,3.4709,4.4774,5.4818,6.4844,7.4865,8.4880]; // secondary maxima: tanβ=β, a sinθ/λ values
const TH_MAX=50;
const LdOf=()=>2*Math.pow(100,P.lg/100);   // L/a 2…200 (log)
const probe={x:XS+P.L,y:4,onScreen:true};
// ---------- physics: Huygens wavelets across the slit ----------
const f2=v=>(v<-0.005?'−':'')+Math.abs(v).toFixed(2);
const sinc=z=>Math.abs(z)<1e-4?1:Math.sin(z)/z;
// complex field at (x,y) from N in-phase wavelets; each sub-strip of width s gets its own far-field factor sinc(k s sinφ/2) (= exact strip integral, kills sampling lobes)
function field(x,y,N){const a=P.a,k=2*Math.PI/P.lam,s=a/N;let re=0,im=0;const dx=x-XS;
  for(let j=0;j<N;j++){const yj=-a/2+(j+0.5)*s,dy=y-yj,r=Math.hypot(dx,dy),A=s*sinc(k*s*dy/Math.max(r,1e-6)/2)/Math.sqrt(r+0.3);re+=A*Math.cos(k*r);im+=A*Math.sin(k*r);}return [re,im];}
const NJ=()=>Math.min(400,Math.max(40,Math.ceil(6*P.a/P.lam)));
function intensity(x,y,N){const [re,im]=field(x,y,N||NJ());return re*re+im*im;}
function edgeDiff(x,y){return Math.hypot(x-XS,y+P.a/2)-Math.hypot(x-XS,y-P.a/2);} // r_bottom − r_top
const darkY=m=>{const s=m*P.lam/P.a;return Math.abs(s)>=1?null:P.L*Math.tan(Math.asin(s));};
function verdict(x){const ax=Math.abs(x),r=Math.round(x);
  if(ax<0.03)return '中央亮紋（θ = 0）';if(r!==0&&Math.abs(x-r)<0.03)return `暗（m=${r<0?'−':''}${Math.abs(r)}）`;
  for(const v of SM)if(Math.abs(ax-v)<0.04)return '亮（次亮紋）';if(ax<1)return '中央亮紋內';return '介於亮暗之間';}
function farField(Ld,thDeg){const t=thDeg*Math.PI/180,yp=Ld*Math.tan(t),ex=Math.hypot(Ld,yp+0.5)-Math.hypot(Ld,yp-0.5),ap=Math.sin(t);return {exact:ex,approx:ap,diffPct:ap>1e-9?Math.abs(ex-ap)/ap*100:0};}
// ---------- WebGL field ----------
const gl=$('gl').getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;uniform vec2 res;uniform float scale,y0,k,ph,xs,a,n,xscr,aa,gain;
void main(){vec2 f=gl_FragCoord.xy;float x=f.x/scale;float y=y0-(res.y-f.y)/scale;float u;
 if(x<xs){u=0.55*cos(k*(x-xs)-ph);}
 else{float s=a/n,sum=0.;for(int i=0;i<40;i++){if(float(i)>=n)break;float yj=-a*.5+(float(i)+.5)*s;vec2 dv=vec2(x-xs,y-yj);float r=length(dv);
   float z=k*s*dv.y/max(r,1e-4)*.5;float ef=abs(z)<1e-3?1.:sin(z)/z;sum+=s*ef/sqrt(r+.3)*cos(k*r-ph);}u=gain*sum;}
 float e=exp(clamp(3.4*u,-20.,20.));float v=(e-1.)/(e+1.);
 vec3 neu=vec3(.925,.94,.955),cr=vec3(.10,.36,.82),tr=vec3(.90,.45,.16);
 vec3 c=v>0.?mix(neu,cr,v):mix(neu,tr,-v);c=mix(neu,c,aa);
 if(x>xscr)c=mix(c,vec3(.97,.975,.98),.85);
 gl_FragColor=vec4(c,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};for(const n of ['res','scale','y0','k','ph','xs','a','n','xscr','aa','gain'])U[n]=gl.getUniformLocation(prog,n);
// ---------- layout ----------
const ov=$('ov'),ctx=ov.getContext('2d');let NARROW=false,W=1,H=1,TW=1,SC=1,Y0=0,stripX=0,stripW=0,graphX=0,graphW=0,RS=1;
function layout(){const r=$('view').getBoundingClientRect();W=r.width;H=r.height;
  NARROW=W<600;graphW=NARROW?104:Math.round(Math.max(124,Math.min(200,W*0.15)));stripW=Math.round(Math.max(20,Math.min(44,W*0.035)));
  TW=Math.max(100,W-graphW-stripW-14);stripX=TW+4;graphX=stripX+stripW+6;SC=TW/XMAX;Y0=H/2/SC;
  RS=Math.min(1,900/TW);const g=$('gl');g.style.width=TW+'px';g.style.height=H+'px';g.width=Math.round(TW*RS);g.height=Math.round(H*RS);gl.viewport(0,0,g.width,g.height);
  const dpr=Math.min(2,devicePixelRatio);ov.width=W*dpr;ov.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);PLC.key='';}
new ResizeObserver(layout).observe($('view'));
const X=x=>x*SC,Yp=y=>(Y0-y)*SC,toW=(px,py)=>[px/SC,Y0-py/SC];
// ---------- drawing ----------
let AA=1,GAIN=1,gk='';
function drawField(){const g=$('gl');const key=P.a+'|'+P.lam;if(key!==gk){gk=key;const [re,im]=field(XS+3,0,NSH);GAIN=0.8/Math.max(1e-6,Math.hypot(re,im));}
  gl.uniform2f(U.res,g.width,g.height);gl.uniform1f(U.scale,SC*RS);gl.uniform1f(U.y0,Y0);gl.uniform1f(U.k,2*Math.PI/P.lam);gl.uniform1f(U.ph,phase);
  gl.uniform1f(U.xs,XS);gl.uniform1f(U.a,P.a);gl.uniform1f(U.n,NSH);gl.uniform1f(U.xscr,XS+P.L);gl.uniform1f(U.gain,GAIN);
  const ppl=P.lam*SC*RS;AA=Math.min(1,Math.max(0,(ppl-3)/3));gl.uniform1f(U.aa,AA);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
const clamp01=v=>Math.min(1,Math.max(0,v));
let IC={key:''},OP={};
function fades(){const al=P.a/P.lam,dyPx=SC*P.L*P.lam/P.a,F=P.a*P.a/(P.lam*P.L);
  return {lab:Math.min(clamp01((dyPx-16)/14),clamp01((5-F)/2.5)),small:clamp01((1.6-al)/0.6),large:clamp01((al-12)/8)};}
function drawOverlay(){ctx.clearRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,0,TW,H);ctx.clip();
  const lam=P.lam,xscr=XS+P.L,a=P.a,fd=fades();OP.lab=fd.lab;OP.small=fd.small;OP.large=fd.large;
  // dark-fringe directions a sinθ = mλ
  const mmax=Math.floor(a/lam-1e-9);
  if(showDir&&fd.lab>0){ctx.save();ctx.globalAlpha=0.8*fd.lab;ctx.strokeStyle='#2e7d32';ctx.lineWidth=2;ctx.setLineDash([9,7]);
    for(let m=-mmax;m<=mmax;m++){if(!m)continue;const t=Math.asin(m*lam/a);ctx.beginPath();ctx.moveTo(X(XS),Yp(0));ctx.lineTo(X(xscr),Yp(P.L*Math.tan(t)));ctx.stroke();}ctx.restore();}
  // barrier with one slit
  ctx.fillStyle='#39424e';ctx.fillRect(X(XS)-5,0,10,Yp(a/2));ctx.fillRect(X(XS)-5,Yp(-a/2),10,H-Yp(-a/2));
  ctx.font='bold 16px sans-serif';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(4,4,82,24);ctx.fillStyle='#39424e';ctx.fillText('→ 平面波',8,22);
  // slit width a
  ctx.strokeStyle='#1b2430';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(XS)-14,Yp(a/2));ctx.lineTo(X(XS)-14,Yp(-a/2));ctx.stroke();ctx.fillStyle='#1b2430';ctx.font='bold 17px sans-serif';ctx.fillText('a',X(XS)-28,Yp(0)+6);
  if(showSrc){const s=a/NSH;for(let j=0;j<NSH;j++){const y=-a/2+(j+0.5)*s;ctx.fillStyle='#fff';ctx.strokeStyle='#1b2430';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(X(XS),Yp(y),Math.max(1.6,Math.min(4,s*SC*0.4)),0,7);ctx.fill();ctx.stroke();}}
  // screen + L
  ctx.strokeStyle='#1b2430';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(xscr),0);ctx.lineTo(X(xscr),H);ctx.stroke();
  ctx.strokeStyle='#5a6878';ctx.lineWidth=1.5;const ly=H-14;ctx.beginPath();ctx.moveTo(X(XS),ly);ctx.lineTo(X(xscr),ly);ctx.stroke();ctx.fillStyle='#5a6878';ctx.font='15px sans-serif';ctx.fillText('L',X(XS+P.L/2)-4,ly-5);
  // probe: paths from both slit edges
  ctx.lineWidth=2.5;ctx.strokeStyle='#7a2fc0';for(const ey of [a/2,-a/2]){ctx.beginPath();ctx.moveTo(X(XS),Yp(ey));ctx.lineTo(X(probe.x),Yp(probe.y));ctx.stroke();}
  ctx.fillStyle='#7a2fc0';ctx.beginPath();ctx.arc(X(probe.x),Yp(probe.y),9,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  {const pi=probeInfo(),t=`Δ = ${f2(pi.D)}λ`;ctx.font='bold 15px sans-serif';const tw=ctx.measureText(t).width+10;let bx=X(probe.x)-tw-14,by=Yp(probe.y)-30;if(bx<X(XS)+12)bx=X(probe.x)+14;by=Math.max(4,Math.min(H-26,by));
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fillRect(bx,by,tw,22);ctx.strokeStyle='#7a2fc0';ctx.lineWidth=1;ctx.strokeRect(bx,by,tw,22);ctx.fillStyle='#7a2fc0';ctx.fillText(t,bx+5,by+16);}
  ctx.restore();
  // screen strip + intensity graph from the wavelet sum
  const n=Math.ceil(H),SS=2,ik=`${lam}|${a}|${P.L}|${n}|${Y0}|${SC}`;
  if(IC.key!==ik){const N=NJ(),mn=new Float32Array(n),mx=new Float32Array(n),av=new Float32Array(n);let Im=0;
    for(let i=0;i<n;i++){let lo=1e9,hi=0,s2=0;for(let k=0;k<SS;k++){const v=intensity(xscr,Y0-(i+(k+0.5)/SS)/SC,N);lo=Math.min(lo,v);hi=Math.max(hi,v);s2+=v;}mn[i]=lo;mx[i]=hi;av[i]=s2/SS;if(hi>Im)Im=hi;}
    IC={key:ik,mn,mx,av,Im};}
  const {mn,mx,av,Im}=IC;
  for(let i=0;i<n;i++){const v=Math.pow(av[i]/Im,0.6);ctx.fillStyle=`rgb(${Math.round(15+240*v)},${Math.round(15+90*v)},${Math.round(25+70*v)})`;ctx.fillRect(stripX,i,stripW,1.2);}
  ctx.strokeStyle='#1b2430';ctx.lineWidth=1;ctx.strokeRect(stripX,0,stripW,H);
  ctx.fillStyle='#fff';ctx.fillRect(graphX,0,graphW,H);ctx.strokeStyle='#cfd8e3';ctx.strokeRect(graphX,0,graphW,H);
  const LW=NARROW?44:76,gx=v=>graphX+6+(graphW-LW-6)*v/Im;
  ctx.fillStyle='rgba(211,47,47,0.35)';for(let i=0;i<n;i++){const p=gx(mn[i]),q=gx(mx[i]);ctx.fillRect(p,i,Math.max(1.5,q-p),1);}
  ctx.strokeStyle='#d32f2f';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<n;i++){const px=gx(av[i]);i?ctx.lineTo(px,i):ctx.moveTo(px,i);}ctx.stroke();
  // labels: 暗紋 m, 中央亮紋 + width bracket (cross-faded)
  ctx.save();ctx.globalAlpha=fd.lab;ctx.font='bold 14px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';let lastY=-1e9;const SL=[];
  if(fd.lab>0)for(let m=-mmax;m<=mmax;m++){if(!m)continue;const y=darkY(m);if(y===null)continue;const py=Yp(y);if(py<8||py>H-8)continue;SL.push(py);
    ctx.strokeStyle='#2e7d32';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(stripX-6,py);ctx.lineTo(stripX+stripW+4,py);ctx.stroke();    ctx.fillStyle='#2e7d32';ctx.fillText(NARROW?`暗${m<0?'−':'+'}${Math.abs(m)}`:`暗 m=${m<0?'−':'+'}${Math.abs(m)}`,graphX+graphW-3,py);}
  const y1=darkY(1);
  if(y1!==null&&Yp(y1)>4){const p1=Yp(y1),p2=Yp(-y1),bx=graphX+graphW-LW+4;ctx.strokeStyle='#1b2430';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx+4,p1+3);ctx.lineTo(bx,p1+3);ctx.lineTo(bx,p2-3);ctx.lineTo(bx+4,p2-3);ctx.stroke();
    if(p2-p1>90&&!NARROW){ctx.fillStyle='#1b2430';ctx.font='bold 12px sans-serif';ctx.textAlign='right';ctx.fillText('寬≈2Lλ/a',graphX+graphW-3,Yp(0)+20);}}
  ctx.restore();
  ctx.save();ctx.font='bold 14px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';const cy0=Yp(0);ctx.fillStyle='rgba(255,255,255,0.9)';const ct=NARROW?'中央':'中央亮紋';const cwid=ctx.measureText(ct).width;ctx.fillRect(graphX+graphW-cwid-6,cy0-10,cwid+4,20);ctx.fillStyle='#b71c1c';ctx.fillText(ct,graphX+graphW-3,cy0);ctx.restore();
  OP.screenLabels=SL;
  if(par)drawParallel();
  ctx.textAlign='left';ctx.fillStyle='#5a6878';ctx.font='13px sans-serif';ctx.fillText('屏幕',stripX,H-4);ctx.fillText('強度 I',graphX+6,14);}
function arc(cx,cy,r,a0,a1){ctx.beginPath();ctx.arc(cx,cy,r,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke();}
const PAL=['#7b1fa2','#00897b','#1565c0','#ef6c00','#c2185b','#558b2f','#6d4c41','#455a64'];
let HL=-1,HLK=8,PG=null,INS=null,WFG=null,WFf=0.5,wdrag=false,FF=null,SEL=null,INSG=null,PLC={key:''},dragged=false;
